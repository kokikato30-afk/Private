
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eee7dc">
<title>Slow Time - Stopwatch</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

:root {
  --bg: #eee8de;
  --card: #faf7f1;
  --brown: #9a8068;
  --brown-dark: #725b47;
  --brown-light: #d8c7b4;
  --text: #594a3c;
  --muted: #a99a89;
  --line: #e9e0d4;
  --white: #fffdf9;
  --green: #899b83;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% 15%, #f8f2e9 0, transparent 35%),
    linear-gradient(145deg, #eee8de, #e9dfd2);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.app {
  width: 100%;
  max-width: 470px;
  background: var(--card);
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 30px;
  padding: 32px 30px 26px;
  box-shadow:
    0 25px 70px rgba(104, 79, 54, .10),
    0 3px 12px rgba(104, 79, 54, .04);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 36px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-icon {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  background: #e9dfd2;
  display: grid;
  place-items: center;
  color: var(--brown-dark);
  font-size: 19px;
}

.brand-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
}

.brand-sub {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-top: 3px;
}

.status {
  font-size: 10px;
  color: var(--brown);
  background: #f0e9df;
  border-radius: 30px;
  padding: 7px 12px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #b9aa98;
}

.status.running .status-dot {
  background: var(--green);
  box-shadow: 0 0 0 3px #899b8320;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  50% { opacity: .4; }
}

.display {
  text-align: center;
  padding: 32px 0 35px;
  background: #f2ece3;
  border: 1px solid #ebe2d7;
  border-radius: 24px;
  position: relative;
  overflow: hidden;
}

.display::before {
  content: "";
  position: absolute;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  border: 1px solid rgba(154,128,104,.08);
  top: -120px;
  right: -60px;
}

.display-label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 15px;
}

.time {
  font-family: 'DM Mono', monospace;
  font-size: clamp(43px, 11vw, 59px);
  font-weight: 400;
  letter-spacing: -3px;
  color: var(--brown-dark);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  line-height: 1.2;
}

.time small {
  font-size: .48em;
  color: #a28c76;
  letter-spacing: -1px;
}

.time-caption {
  margin-top: 15px;
  color: #b1a392;
  font-size: 10px;
  letter-spacing: 2px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 11px;
  margin: 25px 0 31px;
}

button {
  border: none;
  font-family: inherit;
  cursor: pointer;
  transition: transform .15s, background .2s, box-shadow .2s;
  touch-action: manipulation;
}

button:active {
  transform: scale(.96);
}

.control-btn {
  height: 52px;
  border-radius: 15px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
}

.start-btn {
  background: var(--brown);
  color: white;
  box-shadow: 0 5px 12px rgba(126, 96, 67, .17);
}

.start-btn:hover {
  background: #876d55;
}

.lap-btn {
  background: #e9dfd2;
  color: var(--brown-dark);
}

.lap-btn:hover {
  background: #e2d4c4;
}

.reset-btn {
  background: #f0ece5;
  color: #958675;
}

.reset-btn:hover {
  background: #e9e2d8;
}

.control-btn:disabled {
  opacity: .42;
  cursor: default;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line);
}

.section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
}

.lap-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}

.lap-list {
  min-height: 135px;
  max-height: 230px;
  overflow-y: auto;
}

.empty {
  text-align: center;
  padding: 38px 0;
  color: #b5a897;
  font-size: 11px;
  letter-spacing: 1px;
  line-height: 2;
}

.lap-row {
  display: grid;
  grid-template-columns: 55px 1fr 1fr;
  align-items: center;
  padding: 14px 8px;
  border-bottom: 1px solid #eee8df;
  animation: appear .25s ease;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.lap-number {
  color: #aa9a87;
  font-size: 11px;
}

.lap-time {
  text-align: center;
  color: var(--text);
}

.lap-total {
  text-align: right;
  color: #9d8b77;
}

.lap-row.fastest .lap-time {
  color: #82967b;
  font-weight: 500;
}

.lap-row.slowest .lap-time {
  color: #b58c78;
}

.legend {
  display: flex;
  justify-content: center;
  gap: 18px;
  padding-top: 13px;
  font-size: 9px;
  color: #a99b8a;
}

.legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

.legend span:last-child i {
  background: #b58c78;
}

.footer {
  margin-top: 24px;
  text-align: center;
  font-size: 9px;
  color: #b8aa99;
  letter-spacing: 2px;
}

@media(max-width: 400px) {
  body { padding: 12px; }
  .app { padding: 25px 19px 21px; border-radius: 25px; }
  .time { font-size: 43px; }
  .controls { gap: 7px; }
  .control-btn { font-size: 11px; }
}
</style>
</head>

<body>

<main class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-icon">◷</div>
      <div>
        <div class="brand-name">Slow Time</div>
        <div class="brand-sub">STOPWATCH</div>
      </div>
    </div>

    <div class="status" id="status">
      <span class="status-dot"></span>
      <span id="statusText">READY</span>
    </div>
  </header>

  <section class="display">
    <div class="display-label">ELAPSED TIME</div>
    <div class="time" id="time">
      00:00<small>.00</small>
    </div>
    <div class="time-caption">TIME FLOWS GENTLY</div>
  </section>

  <div class="controls">
    <button class="control-btn reset-btn" id="resetBtn">リセット</button>
    <button class="control-btn start-btn" id="startBtn">スタート</button>
    <button class="control-btn lap-btn" id="lapBtn" disabled>ラップ</button>
  </div>

  <section>
    <div class="section-heading">
      <div class="section-title">LAP RECORDS</div>
      <div class="lap-count" id="lapCount">00 LAPS</div>
    </div>

    <div class="lap-list" id="lapList">
      <div class="empty">
        まだ記録はありません。<br>
        ラップボタンで記録できます。
      </div>
    </div>

    <div class="legend" id="legend" style="display:none">
      <span><i></i> 最速ラップ</span>
      <span><i></i> 最遅ラップ</span>
    </div>
  </section>

  <footer class="footer">
    MAKE YOUR MOMENT
  </footer>

</main>

<script>
const timeDisplay = document.getElementById('time');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const lapBtn = document.getElementById('lapBtn');
const lapList = document.getElementById('lapList');
const lapCount = document.getElementById('lapCount');
const status = document.getElementById('status');
const statusText = document.getElementById('statusText');
const legend = document.getElementById('legend');

let running = false;
let startTime = 0;
let elapsed = 0;
let laps = [];
let animationId = null;

function formatTime(ms) {
  const total = Math.max(0, Math.floor(ms));
  const minutes = Math.floor(total / 60000);
  const seconds = Math.floor(total / 1000) % 60;
  const centiseconds = Math.floor(total / 10) % 100;

  return {
    full:
      String(minutes).padStart(2, '0') + ':' +
      String(seconds).padStart(2, '0') +
      '<small>.' +
      String(centiseconds).padStart(2, '0') +
      '</small>',
    plain:
      String(minutes).padStart(2, '0') + ':' +
      String(seconds).padStart(2, '0') + '.' +
      String(centiseconds).padStart(2, '0')
  };
}

function currentTime() {
  return elapsed + (running ? performance.now() - startTime : 0);
}

function renderTime() {
  timeDisplay.innerHTML = formatTime(currentTime()).full;

  if (running) {
    animationId = requestAnimationFrame(renderTime);
  }
}

function setStatus(value) {
  statusText.textContent = value;
  status.classList.toggle('running', value === 'RUNNING');
}

function start() {
  if (running) {
    elapsed += performance.now() - startTime;
    running = false;

    cancelAnimationFrame(animationId);
    animationId = null;

    startBtn.textContent = '再開';
    setStatus('PAUSED');
    renderTime();
    return;
  }

  startTime = performance.now();
  running = true;

  startBtn.textContent = '一時停止';
  lapBtn.disabled = false;

  setStatus('RUNNING');
  renderTime();
}

function reset() {
  running = false;
  elapsed = 0;
  laps = [];

  cancelAnimationFrame(animationId);
  animationId = null;

  timeDisplay.innerHTML = '00:00<small>.00</small>';

  startBtn.textContent = 'スタート';
  lapBtn.disabled = true;

  setStatus('READY');
  renderLaps();
}

function addLap() {
  if (!running) return;

  const total = currentTime();
  const previous = laps.length > 0
    ? laps[laps.length - 1].total
    : 0;

  laps.push({
    total,
    split: total - previous
  });

  renderLaps();
}

function renderLaps() {
  lapCount.textContent =
    String(laps.length).padStart(2, '0') + ' LAPS';

  if (laps.length === 0) {
    lapList.innerHTML = `
      <div class="empty">
        まだ記録はありません。<br>
        ラップボタンで記録できます。
      </div>
    `;
    legend.style.display = 'none';
    return;
  }

  const splits = laps.map(l => l.split);
  const min = Math.min(...splits);
  const max = Math.max(...splits);

  legend.style.display = laps.length >= 2 ? 'flex' : 'none';

  lapList.innerHTML = [...laps]
    .map((lap, index) => {
      const isFast = laps.length >= 2 && lap.split === min;
      const isSlow = laps.length >= 2 && lap.split === max;

      const cls = isFast ? 'fastest' : isSlow ? 'slowest' : '';

      return `
        <div class="lap-row ${cls}">
          <div class="lap-number">
            ${String(index + 1).padStart(2, '0')}
          </div>
          <div class="lap-time">
            ${formatTime(lap.split).plain}
          </div>
          <div class="lap-total">
            ${formatTime(lap.total).plain}
          </div>
        </div>
      `;
    })
    .reverse()
    .join('');
}

startBtn.addEventListener('click', start);
resetBtn.addEventListener('click', reset);
lapBtn.addEventListener('click', addLap);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    start();
  }

  if (e.code === 'KeyL' && !e.repeat) {
    addLap();
  }

  if (e.code === 'KeyR' && !e.repeat) {
    reset();
  }
});

renderLaps();
</script>

</body>
</html>
