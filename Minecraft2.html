<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>BLOCK WORLD 3D</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

/* =========================
   クロスヘア
========================= */

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:18px;
    height:18px;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 1px 3px black;
}

#crosshair:before{
    width:18px;
    height:2px;
    top:8px;
}

#crosshair:after{
    width:2px;
    height:18px;
    left:8px;
}

/* =========================
   上部
========================= */

#top{
    position:absolute;
    left:10px;
    top:10px;
    color:white;
    text-shadow:0 2px 4px black;
    font-size:14px;
    font-weight:bold;
}

#info{
    position:absolute;
    right:10px;
    top:10px;
    color:white;
    text-shadow:0 2px 4px black;
    text-align:right;
    font-size:14px;
}

/* =========================
   ジョイスティック
========================= */

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;

    width:140px;
    height:140px;

    border-radius:50%;

    background:rgba(255,255,255,.18);

    border:3px solid rgba(255,255,255,.45);

    pointer-events:auto;

    touch-action:none;
}

#stick{
    position:absolute;

    width:60px;
    height:60px;

    left:37px;
    top:37px;

    border-radius:50%;

    background:rgba(255,255,255,.45);

    border:2px solid white;

    transition:transform .03s;
}

/* =========================
   ボタン
========================= */

.gameButton{

    position:absolute;

    border:none;

    color:white;

    font-weight:bold;

    background:rgba(0,0,0,.45);

    border:2px solid rgba(255,255,255,.45);

    border-radius:15px;

    pointer-events:auto;

    touch-action:none;
}

#jump{

    right:25px;
    bottom:125px;

    width:85px;
    height:75px;

    font-size:15px;
}

#sprint{

    right:25px;
    bottom:30px;

    width:85px;
    height:60px;
}

#breakBtn{

    right:125px;
    bottom:30px;

    width:80px;
    height:60px;
}

#placeBtn{

    right:220px;
    bottom:30px;

    width:80px;
    height:60px;
}

/* =========================
   ホットバー
========================= */

#hotbar{

    position:absolute;

    left:50%;
    bottom:105px;

    transform:translateX(-50%);

    display:flex;
    gap:5px;

    pointer-events:auto;
}

.slot{

    width:48px;
    height:48px;

    background:rgba(0,0,0,.45);

    border:3px solid white;

    border-radius:8px;

    display:flex;

    justify-content:center;
    align-items:center;

    color:white;

    font-size:10px;

    text-align:center;
}

.slot.selected{

    border-color:yellow;
}

/* =========================
   スタート
========================= */

#startScreen{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.58);

    pointer-events:auto;
}

#startBox{

    width:min(90%,430px);

    padding:30px;

    background:rgba(20,30,40,.93);

    color:white;

    border-radius:25px;

    text-align:center;

    box-shadow:
    0 10px 40px rgba(0,0,0,.5);
}

#startBox h1{

    font-size:30px;

    margin-bottom:12px;
}

#startBox p{

    line-height:1.7;

    margin-bottom:20px;
}

.startBtn{

    width:100%;

    padding:15px;

    margin-top:10px;

    border:none;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;
}

/* =========================
   エラー
========================= */

#error{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:90%;
    max-width:500px;

    padding:25px;

    background:#222;

    color:white;

    border-radius:15px;

    display:none;
}

</style>
</head>


<body>


<div id="game"></div>


<div id="ui">

    <div id="crosshair"></div>

    <div id="top">
        BLOCK WORLD 3D<br>
        モード: 探索
    </div>

    <div id="info">

        時間:
        <span id="timeText">
            昼
        </span>

        <br>

        ブロック:
        <span id="blockText">
            草
        </span>

    </div>


    <div id="joystick">

        <div id="stick"></div>

    </div>


    <button
    class="gameButton"
    id="jump">

        ジャンプ

    </button>


    <button
    class="gameButton"
    id="sprint">

        ダッシュ

    </button>


    <button
    class="gameButton"
    id="breakBtn">

        壊す

    </button>


    <button
    class="gameButton"
    id="placeBtn">

        置く

    </button>


    <div id="hotbar"></div>

</div>


<div id="startScreen">

    <div id="startBox">

        <h1>
            🌎 BLOCK WORLD 3D
        </h1>

        <p>

            広い世界を自由に探索しよう！<br>

            敵はいません。<br>

            ブロックを置いたり壊したりできます。<br>

            🌋 溶岩湖もあります！

        </p>


        <button
        class="startBtn"
        id="startBtn">

            ▶ 新しい世界

        </button>


        <button
        class="startBtn"
        id="loadBtn">

            💾 セーブから開始

        </button>

    </div>

</div>


<div id="error">

    <h2>
        ⚠️ 読み込みエラー
    </h2>

    <p>
        3Dエンジンを読み込めませんでした。
        インターネット接続を確認して、
        ページを再読み込みしてください。
    </p>

</div>


<script>


/* ==================================================
   THREE.JS
================================================== */

function loadThree(){

    const script =
    document.createElement("script");

    script.src =
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js";

    script.onload = init;

    script.onerror = () => {

        const backup =
        document.createElement("script");

        backup.src =
        "https://unpkg.com/three@0.160.0/build/three.min.js";

        backup.onload = init;

        backup.onerror = () => {

            document
            .getElementById("error")
            .style.display = "block";

        };

        document.head
        .appendChild(backup);

    };

    document.head
    .appendChild(script);

}

loadThree();


/* ==================================================
   GAME
================================================== */

function init(){

"use strict";


/* ==================================================
   WORLD SETTINGS
================================================== */

const WORLD_SIZE = 100;

const HALF =
WORLD_SIZE / 2;


/*
   チャンクサイズ

   10×10ブロック
*/

const CHUNK_SIZE = 10;


/*
   最初から作る範囲

   小さいほど軽い
*/

const LOAD_RADIUS = 2;


/*
   プレイヤーから
   これ以上遠くなったら
   チャンクを削除
*/

const UNLOAD_RADIUS = 4;


/* ==================================================
   PLAYER
================================================== */

const PLAYER_WIDTH = .58;

const PLAYER_DEPTH = .58;

const PLAYER_HEIGHT = 1.8;

const GRAVITY = 18;

const JUMP_POWER = 7;


/* ==================================================
   THREE
================================================== */

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x87ceeb);


scene.fog =
new THREE.Fog(
    0x87ceeb,
    25,
    55
);


const camera =
new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    .05,
    150
);


const renderer =
new THREE.WebGLRenderer({
    antialias:true
});


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.25
    )
);


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.outputColorSpace =
THREE.SRGBColorSpace;


document
.getElementById("game")
.appendChild(renderer.domElement);


/* ==================================================
   LIGHT
================================================== */

const ambient =
new THREE.HemisphereLight(
    0xbfe8ff,
    0x555555,
    1.2
);

scene.add(ambient);


const sun =
new THREE.DirectionalLight(
    0xffffff,
    1.5
);

sun.position.set(
    30,
    60,
    20
);

scene.add(sun);


/* ==================================================
   BLOCK TYPES
================================================== */

const BLOCKS = {

    grass:{
        color:0x55aa45,
        solid:true,
        name:"草"
    },

    dirt:{
        color:0x8b5a2b,
        solid:true,
        name:"土"
    },

    stone:{
        color:0x888888,
        solid:true,
        name:"石"
    },

    wood:{
        color:0x8b5a2b,
        solid:true,
        name:"木"
    },

    leaves:{
        color:0x238a38,
        solid:true,
        name:"葉"
    },

    sand:{
        color:0xd8c078,
        solid:true,
        name:"砂"
    },

    glass:{
        color:0x9de8ff,
        solid:true,
        transparent:true,
        name:"ガラス"
    },

    water:{
        color:0x3388dd,
        solid:false,
        transparent:true,
        name:"水"
    },

    lava:{
        color:0xff5500,
        solid:false,
        transparent:true,
        emissive:true,
        name:"溶岩"
    }

};


/* ==================================================
   WORLD DATA
================================================== */


/*
   blocks

   全ワールドのブロック情報

   Meshは近くにあるものだけ
   作ります。
*/

const blocks =
new Map();


/*
   generatedChunks

   現在Mesh化されているチャンク
*/

const generatedChunks =
new Map();


/*
   blockMeshes

   ブロック → Mesh
*/

const blockMeshes =
new Map();


/* ==================================================
   KEY
================================================== */

function key(x,y,z){

    return (
        x + "," +
        y + "," +
        z
    );

}


/* ==================================================
   HEIGHT
================================================== */

function heightAt(x,z){

    return Math.floor(

        5

        +

        Math.sin(x*.14)*2.5

        +

        Math.cos(z*.12)*2

        +

        Math.sin(
            (x+z)*.07
        )*2

    );

}


/* ==================================================
   CHUNK KEY
================================================== */

function chunkKey(cx,cz){

    return cx + "," + cz;

}


function getChunkX(x){

    return Math.floor(
        (x + HALF) /
        CHUNK_SIZE
    );

}


function getChunkZ(z){

    return Math.floor(
        (z + HALF) /
        CHUNK_SIZE
    );

}


/* ==================================================
   ADD WORLD BLOCK
================================================== */

function addWorldBlock(
    x,y,z,type
){

    if(
        x < -HALF ||
        x >= HALF ||
        z < -HALF ||
        z >= HALF
    ){

        return;

    }

    const k =
    key(x,y,z);

    if(blocks.has(k))
        return;

    blocks.set(
        k,
        type
    );

}


/* ==================================================
   REMOVE WORLD BLOCK
================================================== */

function removeWorldBlock(
    x,y,z
){

    const k =
    key(x,y,z);

    blocks.delete(k);

}


/* ==================================================
   GENERATE TERRAIN DATA
================================================== */

function generateTerrain(){

    /*
       地形
    */

    for(
        let x=-HALF;
        x<HALF;
        x++
    ){

        for(
            let z=-HALF;
            z<HALF;
            z++
        ){

            const h =
            heightAt(x,z);


            for(
                let y=0;
                y<=h;
                y++
            ){

                let type =
                "stone";


                if(y === h){

                    if(h <= 3)
                        type="sand";
                    else
                        type="grass";

                }
                else if(
                    y >= h-3
                ){

                    type="dirt";

                }


                addWorldBlock(
                    x,y,z,type
                );

            }

        }

    }


    /*
       木
    */

    for(
        let i=0;
        i<80;
        i++
    ){

        const x =
        Math.floor(
            Math.random()*80 - 40
        );

        const z =
        Math.floor(
            Math.random()*80 - 40
        );

        const h =
        heightAt(x,z);


        if(h < 6)
            continue;


        /*
           幹
        */

        for(
            let y=1;
            y<=4;
            y++
        ){

            addWorldBlock(
                x,
                h+y,
                z,
                "wood"
            );

        }


        /*
           葉
        */

        for(
            let dx=-2;
            dx<=2;
            dx++
        ){

            for(
                let dz=-2;
                dz<=2;
                dz++
            ){

                for(
                    let dy=3;
                    dy<=5;
                    dy++
                ){

                    if(
                        Math.abs(dx)+
                        Math.abs(dz)
                        <=3
                    ){

                        addWorldBlock(
                            x+dx,
                            h+dy,
                            z+dz,
                            "leaves"
                        );

                    }

                }

            }

        }

    }


    /*
       水
    */

    for(
        let x=-45;
        x<45;
        x++
    ){

        for(
            let z=-45;
            z<45;
            z++
        ){

            if(
                heightAt(x,z) <= 3
            ){

                addWorldBlock(
                    x,
                    4,
                    z,
                    "water"
                );

            }

        }

    }


    /*
       🌋 溶岩湖
    */

    for(
        let lake=0;
        lake<5;
        lake++
    ){

        const cx =
        Math.floor(
            Math.random()*70 - 35
        );

        const cz =
        Math.floor(
            Math.random()*70 - 35
        );

        const radius =
        3 +
        Math.floor(
            Math.random()*3
        );


        for(
            let x=cx-radius;
            x<=cx+radius;
            x++
        ){

            for(
                let z=cz-radius;
                z<=cz+radius;
                z++
            ){

                const distance =
                Math.sqrt(
                    (x-cx)*(x-cx)
                    +
                    (z-cz)*(z-cz)
                );


                if(
                    distance <= radius
                    &&
                    heightAt(x,z)>=5
                    &&
                    heightAt(x,z)<=8
                ){

                    const y =
                    heightAt(x,z)+1;


                    /*
                       小さな溶岩湖
                    */

                    addWorldBlock(
                        x,
                        y,
                        z,
                        "lava"
                    );

                }

            }

        }

    }

}


/* ==================================================
   BLOCK MESH
================================================== */

const geometry =
new THREE.BoxGeometry(
    1,1,1
);


/*
   マテリアルを使い回す

   毎回newしないので軽量
*/

const materials={};


for(
    const type in BLOCKS
){

    const data =
    BLOCKS[type];


    materials[type] =
    new THREE.MeshStandardMaterial({

        color:data.color,

        transparent:
        !!data.transparent,

        opacity:
        data.transparent
        ? .55
        : 1,

        roughness:.85,

        emissive:
        data.emissive
        ? 0xff2200
        : 0x000000,

        emissiveIntensity:
        data.emissive
        ? .35
        : 0

    });

}


/* ==================================================
   CREATE MESH
================================================== */

function createMesh(
    x,y,z,type
){

    const mesh =
    new THREE.Mesh(
        geometry,
        materials[type]
    );


    mesh.position.set(
        x+.5,
        y+.5,
        z+.5
    );


    mesh.userData = {

        x:x,
        y:y,
        z:z,
        type:type

    };


    scene.add(mesh);


    blockMeshes.set(
        key(x,y,z),
        mesh
    );


    return mesh;

}


/* ==================================================
   LOAD CHUNK
================================================== */

function loadChunk(cx,cz){

    const ck =
    chunkKey(cx,cz);


    if(
        generatedChunks.has(ck)
    ){

        return;

    }


    const meshes=[];


    const startX =
    -HALF +
    cx*CHUNK_SIZE;


    const startZ =
    -HALF +
    cz*CHUNK_SIZE;


    for(
        let x=startX;
        x<startX+CHUNK_SIZE;
        x++
    ){

        for(
            let z=startZ;
            z<startZ+CHUNK_SIZE;
            z++
        ){

            for(
                let y=0;
                y<20;
                y++
            ){

                const type =
                blocks.get(
                    key(x,y,z)
                );


                if(type){

                    /*
                       水と溶岩は
                       地下ブロックを隠すので
                       上にあるものだけ表示
                    */

                    const mesh =
                    createMesh(
                        x,y,z,type
                    );


                    meshes.push(mesh);

                }

            }

        }

    }


    generatedChunks.set(
        ck,
        meshes
    );

}


/* ==================================================
   UNLOAD CHUNK
================================================== */

function unloadChunk(cx,cz){

    const ck =
    chunkKey(cx,cz);


    const list =
    generatedChunks.get(ck);


    if(!list)
        return;


    for(
        const mesh of list
    ){

        scene.remove(mesh);

        blockMeshes.delete(
            key(
                mesh.userData.x,
                mesh.userData.y,
                mesh.userData.z
            )
        );

    }


    generatedChunks.delete(ck);

}


/* ==================================================
   UPDATE CHUNKS
================================================== */

let lastChunkX=null;
let lastChunkZ=null;


function updateChunks(){

    const cx =
    getChunkX(player.x);

    const cz =
    getChunkZ(player.z);


    if(
        cx === lastChunkX &&
        cz === lastChunkZ
    ){

        return;

    }


    lastChunkX=cx;
    lastChunkZ=cz;


    /*
       近いチャンクをロード
    */

    for(
        let dx=-LOAD_RADIUS;
        dx<=LOAD_RADIUS;
        dx++
    ){

        for(
            let dz=-LOAD_RADIUS;
            dz<=LOAD_RADIUS;
            dz++
        ){

            const nx=cx+dx;
            const nz=cz+dz;


            if(
                nx < 0 ||
                nz < 0 ||
                nx >= WORLD_SIZE/CHUNK_SIZE ||
                nz >= WORLD_SIZE/CHUNK_SIZE
            ){

                continue;

            }


            loadChunk(
                nx,nz
            );

        }

    }


    /*
       遠いチャンクを削除
    */

    for(
        const ck of
        generatedChunks.keys()
    ){

        const parts =
        ck.split(",")
        .map(Number);


        const dx =
        Math.abs(
            parts[0]-cx
        );

        const dz =
        Math.abs(
            parts[1]-cz
        );


        if(
            dx > UNLOAD_RADIUS ||
            dz > UNLOAD_RADIUS
        ){

            unloadChunk(
                parts[0],
                parts[1]
            );

        }

    }

}


/* ==================================================
   PLAYER
================================================== */

const player={

    x:0,

    y:10,

    z:0,

    vx:0,

    vy:0,

    vz:0,

    yaw:0,

    pitch:-.2,

    grounded:false,

    sprint:false

};


/* ==================================================
   RESPAWN
================================================== */

function respawn(){

    player.x=0;

    player.z=0;

    player.y =
    heightAt(0,0)+2;

    player.vx=0;

    player.vy=0;

    player.vz=0;

}


/* ==================================================
   COLLISION
================================================== */

function collides(
    px,py,pz
){

    const minX =
    Math.floor(
        px-PLAYER_WIDTH/2
    );

    const maxX =
    Math.floor(
        px+PLAYER_WIDTH/2
    );


    const minY =
    Math.floor(py);


    const maxY =
    Math.floor(
        py+PLAYER_HEIGHT
    );


    const minZ =
    Math.floor(
        pz-PLAYER_DEPTH/2
    );

    const maxZ =
    Math.floor(
        pz+PLAYER_DEPTH/2
    );


    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            for(
                let z=minZ;
                z<=maxZ;
                z++
            ){

                const type =
                blocks.get(
                    key(x,y,z)
                );


                if(
                    type &&
                    BLOCKS[type].solid
                ){

                    if(

                        px+
                        PLAYER_WIDTH/2
                        > x

                        &&

                        px-
                        PLAYER_WIDTH/2
                        < x+1

                        &&

                        py+
                        PLAYER_HEIGHT
                        > y

                        &&

                        py
                        < y+1

                        &&

                        pz+
                        PLAYER_DEPTH/2
                        > z

                        &&

                        pz-
                        PLAYER_DEPTH/2
                        < z+1

                    ){

                        return true;

                    }

                }

            }

        }

    }


    return false;

}


/* ==================================================
   MOVE X
================================================== */

function moveX(amount){

    player.x += amount;


    if(
        collides(
            player.x,
            player.y,
            player.z
        )
    ){

        player.x -= amount;

        player.vx=0;

    }

}


/* ==================================================
   MOVE Z
================================================== */

function moveZ(amount){

    player.z += amount;


    if(
        collides(
            player.x,
            player.y,
            player.z
        )
    ){

        player.z -= amount;

        player.vz=0;

    }

}


/* ==================================================
   MOVE Y
================================================== */

function moveY(amount){

    player.y += amount;


    if(
        collides(
            player.x,
            player.y,
            player.z
        )
    ){

        if(amount<0){

            player.grounded=true;

        }


        player.y -= amount;

        player.vy=0;

    }
    else{

        player.grounded=false;

    }

}


/* ==================================================
   JUMP
================================================== */

function jump(){

    if(
        player.grounded
    ){

        player.vy =
        JUMP_POWER;

        player.grounded=false;

    }

}


/* ==================================================
   JOYSTICK
================================================== */

const joystick =
document.getElementById(
    "joystick"
);


const stick =
document.getElementById(
    "stick"
);


let joyX=0;

let joyY=0;

let joyId=null;


function updateJoystick(t){

    const rect =
    joystick.getBoundingClientRect();


    const cx =
    rect.left+
    rect.width/2;


    const cy =
    rect.top+
    rect.height/2;


    let dx =
    t.clientX-cx;


    let dy =
    t.clientY-cy;


    const max=40;


    const length =
    Math.sqrt(
        dx*dx+
        dy*dy
    );


    if(
        length>max
    ){

        dx =
        dx/length*max;

        dy =
        dy/length*max;

    }


    joyX =
    dx/max;


    joyY =
    dy/max;


    stick.style.transform =
    `translate(${dx}px,${dy}px)`;

}


/*
   上 = 前

   下 = 後ろ

   ここが今回の修正版
*/

joystick.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        const t =
        e.changedTouches[0];

        joyId=t.identifier;

        updateJoystick(t);

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        for(
            const t of e.changedTouches
        ){

            if(
                t.identifier===joyId
            ){

                updateJoystick(t);

            }

        }

    },
    {passive:false}
);


function resetJoystick(){

    joyX=0;

    joyY=0;

    joyId=null;

    stick.style.transform =
    "translate(0,0)";

}


joystick.addEventListener(
    "touchend",
    resetJoystick
);

joystick.addEventListener(
    "touchcancel",
    resetJoystick
);

/* ==================================================
   CAMERA LOOK
================================================== */

let lookId=null;

let lastLookX=0;

let lastLookY=0;


renderer.domElement.addEventListener(
    "touchstart",
    e=>{

        /*
           1本指だけ
        */

        if(
            e.touches.length!==1
        ){

            return;

        }


        const t =
        e.touches[0];


        lookId =
        t.identifier;


        lastLookX =
        t.clientX;


        lastLookY =
        t.clientY;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchmove",
    e=>{

        for(
            const t of e.changedTouches
        ){

            if(
                t.identifier !== lookId
            ){

                continue;

            }


            const dx =
            t.clientX-lastLookX;


            const dy =
            t.clientY-lastLookY;


            player.yaw -=
            dx*.006;


            player.pitch -=
            dy*.004;


            player.pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    player.pitch
                )
            );


            lastLookX =
            t.clientX;


            lastLookY =
            t.clientY;

        }

    },
    {passive:false}
);


/* ==================================================
   RAYCAST
================================================== */

const raycaster =
new THREE.Raycaster();


function getTarget(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );


    const visibleMeshes =
    Array.from(
        blockMeshes.values()
    );


    const hits =
    raycaster.intersectObjects(
        visibleMeshes,
        false
    );


    if(
        hits.length===0
    ){

        return null;

    }


    if(
        hits[0].distance>6
    ){

        return null;

    }


    return hits[0];

}


/* ==================================================
   BREAK BLOCK
================================================== */

function breakBlock(){

    const hit =
    getTarget();


    if(!hit)
        return;


    const d =
    hit.object.userData;


    if(
        d.y<=0
    )
        return;


    removeWorldBlock(
        d.x,
        d.y,
        d.z
    );


    /*
       現在表示されている
       Meshを削除
    */

    const mesh =
    blockMeshes.get(
        key(
            d.x,
            d.y,
            d.z
        )
    );


    if(mesh){

        scene.remove(mesh);

        blockMeshes.delete(
            key(
                d.x,
                d.y,
                d.z
            )
        );

    }

}


/* ==================================================
   PLACE BLOCK
================================================== */

function placeBlock(){

    const hit =
    getTarget();


    if(!hit)
        return;


    const d =
    hit.object.userData;


    const normal =
    hit.face.normal;


    const x =
    d.x+
    Math.round(normal.x);


    const y =
    d.y+
    Math.round(normal.y);


    const z =
    d.z+
    Math.round(normal.z);


    /*
       プレイヤーの中に
       ブロックを置かない
    */

    if(

        x+1 >
        player.x-
        PLAYER_WIDTH/2

        &&

        x <
        player.x+
        PLAYER_WIDTH/2

        &&

        y+1 >
        player.y

        &&

        y <
        player.y+
        PLAYER_HEIGHT

        &&

        z+1 >
        player.z-
        PLAYER_DEPTH/2

        &&

        z <
        player.z+
        PLAYER_DEPTH/2

    ){

        return;

    }


    const type =
    inventory[selected];


    addWorldBlock(
        x,y,z,type
    );


    /*
       チャンクが
       現在ロード済みなら
       即座に表示
    */

    const cx =
    getChunkX(x);

    const cz =
    getChunkZ(z);


    const ck =
    chunkKey(cx,cz);


    if(
        generatedChunks.has(ck)
    ){

        const mesh =
        createMesh(
            x,y,z,type
        );


        generatedChunks
        .get(ck)
        .push(mesh);

    }

}

/* ==================================================
   INVENTORY
================================================== */

const inventory = [

    "grass",
    "dirt",
    "stone",
    "wood",
    "leaves",

    "glass"

];


let selected=0;


const hotbar =
document.getElementById(

);


function updateHotbar(){

    hotbar.innerHTML="";


    inventory.forEach(
        (type,index)=>{

            const slot =
            document.createElement(
                "div"

            "slot";


            slot.textContent =

                    updateHotbar();

            );

    );

}


updateHotbar();

}

/* ==================================================
   PLAYER UPDATE
================================================== */

function updatePlayer(dt){

    /*
       ジョイスティック
       上 = 前
       下 = 後ろ
    */

    let forward =
    -joyY;


    /*
       カメラの向きに対して
       前進方向を計算
    */

    let side =
    joyX;


    const speed =
    player.sprint
    ? 6
    : 3.5;


    let mx =
    Math.sin(
        player.yaw
    ) * forward
    +
    Math.cos(
        player.yaw
    ) * side;


    let mz =
    Math.cos(
        player.yaw
    ) * forward
    -
    Math.sin(
        player.yaw
    ) * side;


    const length =
    Math.sqrt(
        mx*mx+
        mz*mz
    );


    if(length>0){

        mx/=length;

        mz/=length;

    }


    const amount =
    speed*dt;


    /*
       移動を細かく分割

       ブロックすり抜け防止
    */

    const steps =
    Math.max(
        1,
        Math.ceil(
            amount/.05
        )
    );


    for(
        let i=0;
        i<steps;
        i++
    ){

        moveX(
            mx*amount/steps
        );

        moveZ(
            mz*amount/steps
        );

    }


    /*
       重力
    */

    player.vy -=
    GRAVITY*dt;


    const vertical =
    player.vy*dt;


    const ySteps =
    Math.max(
        1,
        Math.ceil(
            Math.abs(
                vertical
            )/.05
        )
    );


    for(
        let i=0;
        i<ySteps;
        i++
    ){

        moveY(
            vertical/ySteps
        );

    }


    /*
       落下
    */

    if(
        player.y < -20
    ){

        respawn();

    }


    /*
       チャンク更新
    */

    updateChunks();

}


/* ==================================================
   CAMERA
================================================== */

function updateCamera(){

    camera.position.set(

        player.x,

        player.y+1.55,

        player.z

    );


    camera.rotation.order =
    "YXZ";


    camera.rotation.y =
    player.yaw;


    camera.rotation.x =
    player.pitch;

}


/* ==================================================
   DAY NIGHT
================================================== */

let timeOfDay=0;


function updateDayNight(dt){

    timeOfDay +=
    dt*.025;


    const angle =
    timeOfDay %
    (Math.PI*2);


    const sy =
    Math.sin(angle);


    sun.position.set(

        Math.cos(angle)*60,

        sy*60,

        Math.sin(angle)*60

    );


    const daylight =
    Math.max(
        .15,
        sy*.5+.5
    );


    ambient.intensity =
    .25+
    daylight*.9;


    sun.intensity =
    daylight*1.8;


    if(sy>0){

        scene.background =
        new THREE.Color(
            0x87ceeb
        );


        scene.fog.color =
        new THREE.Color(
            0x87ceeb
        );


        document
        .getElementById(
            "timeText"
        )
        .textContent="昼";

    }
    else{

        scene.background =
        new THREE.Color(
            0x10152e
        );


        scene.fog.color =
        new THREE.Color(
            0x10152e
        );


        document
        .getElementById(
            "timeText"
        )
        .textContent="夜";

    }

}


/* ==================================================
   LAVA ANIMATION
================================================== */

function animateLava(time){

    for(
        const mesh of
        blockMeshes.values()
    ){

        if(
            mesh.userData.type ===
            "lava"
        ){

            const base =
            mesh.userData.y+.5;


            mesh.position.y =
            base+

            Math.sin(

                time*.002

                +

                mesh.userData.x

                +

                mesh.userData.z

            )*.025;

        }

    }

}


/* ==================================================
   SAVE
================================================== */

function saveGame(){

    const data={

        blocks:
        Array.from(
            blocks.entries()
        ),

        player:{

            x:player.x,

            y:player.y,

            z:player.z,

            yaw:player.yaw,

            pitch:player.pitch

        }

    };


    localStorage.setItem(

        "BLOCK_WORLD_SAVE",

        JSON.stringify(data)

    );

}


/* ==================================================
   LOAD
================================================== */

function loadGame(){

    const raw =
    localStorage.getItem(
        "BLOCK_WORLD_SAVE"
    );


    if(!raw){

        generateTerrain();

        respawn();

        return;

    }


    try{

        const data =
        JSON.parse(raw);


        blocks.clear();


        /*
           保存データ復元
        */

        for(
            const item of
            data.blocks
        ){

            blocks.set(
                item[0],
                item[1]
            );

        }


        player.x =
        data.player.x;


        player.y =
        data.player.y;


        player.z =
        data.player.z;


        player.yaw =
        data.player.yaw;


        player.pitch =
        data.player.pitch;

    }
    catch(e){

        console.log(e);

        generateTerrain();

        respawn();

    }

}


/* ==================================================
   START
================================================== */

let started=false;


function startGame(load){

    document
    .getElementById(
        "startScreen"
    )
    .style.display="none";


    started=true;


    if(load){

        loadGame();

    }
    else{

        generateTerrain();

        respawn();

    }


    /*
       最初のチャンクを
       プレイヤー周辺だけロード
    */

    updateChunks();

}


/* ==================================================
   START BUTTONS
================================================== */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    ()=>{
        startGame(false);
    }
);


document
.getElementById("loadBtn")
.addEventListener(
    "click",
    ()=>{
        startGame(true);
    }
);


/* ==================================================
   AUTO SAVE
================================================== */

setInterval(
    ()=>{

        if(started){

            saveGame();

        }

    },
    10000
);


/* ==================================================
   MAIN LOOP
================================================== */

let lastTime =
performance.now();


function loop(time){

    requestAnimationFrame(
        loop
    );


    if(!started){

        renderer.render(
            scene,
            camera
        );

        return;

    }


    let dt =
    (time-lastTime)/1000;


    lastTime=time;


    dt =
    Math.min(
        dt,
        .05
    );


    updatePlayer(dt);

    updateCamera();

    updateDayNight(dt);

    animateLava(time);


    renderer.render(
        scene,
        camera
    );

}


requestAnimationFrame(
    loop
);


/* ==================================================
   RESIZE
================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        innerWidth/
        innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

}
