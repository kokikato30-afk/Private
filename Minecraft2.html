<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>BLOCK WORLD 3D</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:18px;
    height:18px;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair::before{
    width:18px;
    height:2px;
    top:8px;
    left:0;
}

#crosshair::after{
    width:2px;
    height:18px;
    top:0;
    left:8px;
}

/* ジョイスティック */

#joystick{
    position:absolute;
    left:25px;
    bottom:30px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    border:3px solid rgba(255,255,255,.45);
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    border:2px solid white;
}

/* ボタン */

.gameButton{
    position:absolute;
    border:none;
    color:white;
    font-size:17px;
    font-weight:bold;
    border-radius:15px;
    background:rgba(0,0,0,.45);
    border:2px solid rgba(255,255,255,.45);
    pointer-events:auto;
    touch-action:none;
}

#jump{
    right:30px;
    bottom:120px;
    width:80px;
    height:80px;
}

#sprint{
    right:30px;
    bottom:30px;
    width:80px;
    height:60px;
}

#breakBtn{
    right:125px;
    bottom:30px;
    width:80px;
    height:60px;
}

#placeBtn{
    right:220px;
    bottom:30px;
    width:80px;
    height:60px;
}

/* 上部UI */

#top{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    text-shadow:0 2px 4px black;
    font-weight:bold;
    font-size:15px;
}

#info{
    position:absolute;
    top:10px;
    right:10px;
    color:white;
    text-shadow:0 2px 4px black;
    text-align:right;
    font-size:14px;
}

#hotbar{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
    pointer-events:auto;
}

.slot{
    width:50px;
    height:50px;
    border:3px solid white;
    border-radius:8px;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:11px;
    text-align:center;
}

.slot.selected{
    border:4px solid yellow;
}

/* 開始画面 */

#startScreen{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.55);
    pointer-events:auto;
}

#startBox{
    width:min(90%,420px);
    padding:30px;
    background:rgba(20,30,40,.9);
    border-radius:25px;
    color:white;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

#startBox h1{
    font-size:32px;
    margin-bottom:10px;
}

#startBox p{
    margin-bottom:20px;
    line-height:1.7;
}

.startBtn{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
}

/* エラー */

#error{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:500px;
    padding:25px;
    background:#222;
    color:white;
    border-radius:15px;
    display:none;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">

    <div id="crosshair"></div>

    <div id="top">
        BLOCK WORLD 3D<br>
        モード: <span id="modeText">探索</span>
    </div>

    <div id="info">
        時間: <span id="timeText">昼</span><br>
        選択: <span id="blockText">草</span>
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button class="gameButton" id="jump">ジャンプ</button>
    <button class="gameButton" id="sprint">ダッシュ</button>
    <button class="gameButton" id="breakBtn">壊す</button>
    <button class="gameButton" id="placeBtn">置く</button>

    <div id="hotbar"></div>

</div>

<div id="startScreen">

    <div id="startBox">

        <h1>🌎 BLOCK WORLD 3D</h1>

        <p>
            広い世界を自由に探索しよう！<br>
            敵はいません。<br>
            ブロックを壊したり置いたりできます。
        </p>

        <button class="startBtn" id="startBtn">
            ▶ ゲーム開始
        </button>

        <button class="startBtn" id="loadBtn">
            💾 セーブから開始
        </button>

    </div>

</div>

<div id="error">
    <h2>⚠️ 読み込みエラー</h2>
    <p>
        3Dエンジンを読み込めませんでした。<br>
        インターネット接続を確認して、ページを再読み込みしてください。
    </p>
</div>

<script>
/* =========================================
   THREE.JS 読み込み
========================================= */

function loadThree(){

    const script=document.createElement("script");

    script.src=
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js";

    script.onload=init;

    script.onerror=()=>{

        const s=document.createElement("script");

        s.src=
        "https://unpkg.com/three@0.160.0/build/three.min.js";

        s.onload=init;

        s.onerror=()=>{
            document.getElementById("error").style.display="block";
        };

        document.head.appendChild(s);
    };

    document.head.appendChild(script);
}

loadThree();


/* =========================================
   ゲーム本体
========================================= */

function init(){

"use strict";


/* =========================================
   基本設定
========================================= */

const WORLD_SIZE=100;
const WORLD_HALF=WORLD_SIZE/2;

const BLOCK_SIZE=1;

const GRAVITY=18;
const JUMP_POWER=7;

const PLAYER_WIDTH=.58;
const PLAYER_HEIGHT=1.8;
const PLAYER_DEPTH=.58;

const RENDER_DISTANCE=35;


/* =========================================
   THREE
========================================= */

const scene=new THREE.Scene();

scene.fog=
new THREE.Fog(0x87ceeb,30,RENDER_DISTANCE);

const camera=
new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .05,
    150
);

const renderer=
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace=
THREE.SRGBColorSpace;

document
.getElementById("game")
.appendChild(renderer.domElement);


/* =========================================
   光
========================================= */

const ambient=
new THREE.HemisphereLight(
    0xbfe8ff,
    0x555555,
    1.2
);

scene.add(ambient);

const sun=
new THREE.DirectionalLight(
    0xffffff,
    1.5
);

sun.position.set(30,60,20);

scene.add(sun);


/* =========================================
   ブロック
========================================= */

const BLOCKS={

    grass:{
        color:0x55aa45,
        solid:true,
        name:"草"
    },

    dirt:{
        color:0x8b5a2b,
        solid:true,
        name:"土"
    },

    stone:{
        color:0x888888,
        solid:true,
        name:"石"
    },

    wood:{
        color:0x8b5a2b,
        solid:true,
        name:"木"
    },

    leaves:{
        color:0x228833,
        solid:true,
        name:"葉"
    },

    sand:{
        color:0xd8c078,
        solid:true,
        name:"砂"
    },

    glass:{
        color:0x9de8ff,
        solid:true,
        transparent:true,
        name:"ガラス"
    },

    water:{
        color:0x3388dd,
        solid:false,
        transparent:true,
        name:"水"
    },

    lava:{
        color:0xff5500,
        solid:false,
        transparent:true,
        emissive:true,
        name:"溶岩"
    }
};


/* =========================================
   ワールドデータ
========================================= */

const blocks=new Map();

const meshes=new Map();


function key(x,y,z){

    return `${x},${y},${z}`;

}


/* =========================================
   ブロック生成
========================================= */

function createBlock(x,y,z,type){

    const data=BLOCKS[type];

    if(!data)return;

    const geo=
    new THREE.BoxGeometry(
        BLOCK_SIZE,
        BLOCK_SIZE,
        BLOCK_SIZE
    );

    const mat=
    new THREE.MeshStandardMaterial({

        color:data.color,

        transparent:!!data.transparent,

        opacity:
        data.transparent
        ? .55
        : 1,

        roughness:.8,

        emissive:
        data.emissive
        ? 0xff2200
        : 0x000000,

        emissiveIntensity:
        data.emissive
        ? .35
        : 0
    });

    const mesh=
    new THREE.Mesh(geo,mat);

    mesh.position.set(
        x+.5,
        y+.5,
        z+.5
    );

    mesh.userData={
        x:x,
        y:y,
        z:z,
        type:type
    };

    scene.add(mesh);

    meshes.set(key(x,y,z),mesh);

}


/* =========================================
   ブロック追加
========================================= */

function addBlock(x,y,z,type){

    const k=key(x,y,z);

    if(blocks.has(k))return;

    blocks.set(k,type);

    createBlock(x,y,z,type);

}


/* =========================================
   ブロック削除
========================================= */

function removeBlock(x,y,z){

    const k=key(x,y,z);

    if(!blocks.has(k))return;

    blocks.delete(k);

    const mesh=meshes.get(k);

    if(mesh){

        scene.remove(mesh);

        mesh.geometry.dispose();

        mesh.material.dispose();

        meshes.delete(k);
    }

}


/* =========================================
   当たり判定
========================================= */

function isSolid(x,y,z){

    const type=blocks.get(key(x,y,z));

    if(!type)return false;

    return BLOCKS[type].solid;

}


/* =========================================
   高さ生成
========================================= */

function heightAt(x,z){

    const n=
    Math.sin(x*.16)*2.5+
    Math.cos(z*.13)*2+
    Math.sin((x+z)*.08)*2;

    return Math.floor(5+n);

}


/* =========================================
   木
========================================= */

function makeTree(x,y,z){

    for(let i=0;i<4;i++){

        addBlock(
            x,
            y+i,
            z,
            "wood"
        );

    }

    for(let dx=-2;dx<=2;dx++){

        for(let dz=-2;dz<=2;dz++){

            for(let dy=2;dy<=4;dy++){

                if(
                    Math.abs(dx)+
                    Math.abs(dz)<4
                ){

                    addBlock(
                        x+dx,
                        y+dy,
                        z+dz,
                        "leaves"
                    );

                }

            }

        }

    }

}


/* =========================================
   ワールド生成
========================================= */

function generateWorld(){

    for(
        let x=-WORLD_HALF;
        x<WORLD_HALF;
        x++
    ){

        for(
            let z=-WORLD_HALF;
            z<WORLD_HALF;
            z++
        ){

            const h=heightAt(x,z);

            for(let y=0;y<=h;y++){

                let type="stone";

                if(y===h)
                    type="grass";

                else if(y>=h-3)
                    type="dirt";

                addBlock(
                    x,y,z,type
                );

            }

        }

    }


    /* 砂浜 */

    for(
        let x=-WORLD_HALF;
        x<WORLD_HALF;
        x++
    ){

        for(
            let z=-WORLD_HALF;
            z<WORLD_HALF;
            z++
        ){

            const h=heightAt(x,z);

            if(h<=4){

                for(let y=0;y<=h;y++){

                    removeBlock(x,y,z);

                    addBlock(
                        x,y,z,
                        y===h
                        ?"sand"
                        :"dirt"
                    );

                }

            }

        }

    }


    /* 木 */

    for(let i=0;i<100;i++){

        const x=
        Math.floor(
            Math.random()*80-40
        );

        const z=
        Math.floor(
            Math.random()*80-40
        );

        const y=heightAt(x,z)+1;

        if(
            heightAt(x,z)>=6 &&
            Math.random()<.65
        ){

            makeTree(x,y,z);

        }

    }


    /* 水 */

    for(let x=-45;x<45;x++){

        for(let z=-45;z<45;z++){

            if(
                heightAt(x,z)<=3
            ){

                addBlock(
                    x,
                    4,
                    z,
                    "water"
                );

            }

        }

    }


    /* =====================================
       🌋 溶岩湖
    ===================================== */

    for(let lake=0;lake<6;lake++){

        const cx=
        Math.floor(
            Math.random()*70-35
        );

        const cz=
        Math.floor(
            Math.random()*70-35
        );

        const radius=
        Math.floor(
            Math.random()*3+3
        );

        for(
            let x=cx-radius;
            x<=cx+radius;
            x++
        ){

            for(
                let z=cz-radius;
                z<=cz+radius;
                z++
            ){

                const dist=
                Math.sqrt(
                    (x-cx)*(x-cx)+
                    (z-cz)*(z-cz)
                );

                if(dist<=radius){

                    const ground=
                    heightAt(x,z);

                    /*
                       地面の上を
                       溶岩にする
                    */

                    if(
                        ground>=5 &&
                        ground<=8
                    ){

                        addBlock(
                            x,
                            ground+1,
                            z,
                            "lava"
                        );

                    }

                }

            }

        }

    }

}


/* =========================================
   プレイヤー
========================================= */

const player={

    x:0,
    y:10,
    z:0,

    vx:0,
    vy:0,
    vz:0,

    yaw:0,
    pitch:-0.25,

    grounded:false,

    sprint:false

};


/* =========================================
   プレイヤー位置
========================================= */

function respawn(){

    player.x=0;
    player.z=0;

    player.y=
    heightAt(0,0)+2;

    player.vx=0;
    player.vy=0;
    player.vz=0;

}


/* =========================================
   AABB衝突
========================================= */

function collides(px,py,pz){

    const minX=
    Math.floor(
        px-PLAYER_WIDTH/2
    );

    const maxX=
    Math.floor(
        px+PLAYER_WIDTH/2
    );

    const minY=
    Math.floor(py);

    const maxY=
    Math.floor(
        py+PLAYER_HEIGHT
    );

    const minZ=
    Math.floor(
        pz-PLAYER_DEPTH/2
    );

    const maxZ=
    Math.floor(
        pz+PLAYER_DEPTH/2
    );

    for(let x=minX;x<=maxX;x++){

        for(let y=minY;y<=maxY;y++){

            for(let z=minZ;z<=maxZ;z++){

                if(
                    isSolid(x,y,z)
                ){

                    const bx=x+.5;
                    const by=y+.5;
                    const bz=z+.5;

                    if(
                        Math.abs(px-bx)
                        <
                        PLAYER_WIDTH/2+.5
                        &&
                        py+PLAYER_HEIGHT>y
                        &&
                        py<y+1
                        &&
                        Math.abs(pz-bz)
                        <
                        PLAYER_DEPTH/2+.5
                    ){

                        return true;

                    }

                }

            }

        }

    }

    return false;

}


/* =========================================
   X移動
========================================= */

function moveX(amount){

    player.x+=amount;

    if(
        collides(
            player.x,
            player.y,
            player.z
        )
    ){

        player.x-=amount;
        player.vx=0;

    }

}


/* =========================================
   Z移動
========================================= */

function moveZ(amount){

    player.z+=amount;

    if(
        collides(
            player.x,
            player.y,
            player.z
        )
    ){

        player.z-=amount;
        player.vz=0;

    }

}


/* =========================================
   Y移動
========================================= */

function moveY(amount){

    player.y+=amount;

    if(
        collides(
            player.x,
            player.y,
            player.z
        )
    ){

        if(amount<0){

            player.grounded=true;

        }

        player.y-=amount;

        player.vy=0;

    }else{

        player.grounded=false;

    }

}


/* =========================================
   ジャンプ
========================================= */

function jump(){

    if(player.grounded){

        player.vy=JUMP_POWER;

        player.grounded=false;

    }

}


/* =========================================
   ジョイスティック
========================================= */

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let joyX=0;
let joyY=0;

let joyTouch=null;


function updateJoystick(touch){

    const rect=
    joystick.getBoundingClientRect();

    const cx=
    rect.left+rect.width/2;

    const cy=
    rect.top+rect.height/2;

    let dx=touch.clientX-cx;
    let dy=touch.clientY-cy;

    const max=40;

    const len=
    Math.sqrt(dx*dx+dy*dy);

    if(len>max){

        dx=
        dx/len*max;

        dy=
        dy/len*max;

    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
    `translate(${dx}px,${dy}px)`;

}


joystick.addEventListener(
"touchstart",
e=>{

    joyTouch=
    e.changedTouches[0].identifier;

    updateJoystick(
        e.changedTouches[0]
    );

},
{passive:false}
);


joystick.addEventListener(
"touchmove",
e=>{

    for(const t of e.changedTouches){

        if(t.identifier===joyTouch){

            updateJoystick(t);

        }

    }

},
{passive:false}
);


function resetJoy(){

    joyX=0;
    joyY=0;

    joyTouch=null;

    stick.style.transform=
    "translate(0,0)";

}


joystick.addEventListener(
"touchend",
resetJoy
);

joystick.addEventListener(
"touchcancel",
resetJoy
);


/* =========================================
   ダッシュ
========================================= */

const sprintBtn=
document.getElementById("sprint");

sprintBtn.addEventListener(
"touchstart",
()=>{
    player.sprint=true;
},
{passive:true}
);

sprintBtn.addEventListener(
"touchend",
()=>{
    player.sprint=false;
},
{passive:true}
);


/* =========================================
   ジャンプ
========================================= */

document
.getElementById("jump")
.addEventListener(
"touchstart",
e=>{
    e.preventDefault();
    jump();
},
{passive:false}
);


/* =========================================
   ブロック選択
========================================= */

const inventory=[
    "grass",
    "dirt",
    "stone",
    "wood",
    "leaves",
    "sand",
    "glass"
];

let selected=0;

const hotbar=
document.getElementById("hotbar");

function makeHotbar(){

    hotbar.innerHTML="";

    inventory.forEach(
        (type,i)=>{

            const div=
            document.createElement("div");

            div.className="slot";

            div.textContent=
            BLOCKS[type].name;

            if(i===selected)
                div.classList.add(
                    "selected"
                );

            div.addEventListener(
            "touchstart",
            e=>{

                e.preventDefault();

                selected=i;

                makeHotbar();

                updateInfo();

            },
            {passive:false}
            );

            hotbar.appendChild(div);

        }
    );

}

makeHotbar();


/* =========================================
   ブロック選択用レイキャスト
========================================= */

const raycaster=
new THREE.Raycaster();


function getTargetBlock(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const objects=
    Array.from(
        meshes.values()
    );

    const hits=
    raycaster.intersectObjects(
        objects,
        false
    );

    if(hits.length===0)
        return null;

    if(hits[0].distance>6)
        return null;

    return hits[0];

}


/* =========================================
   ブロックを壊す
========================================= */

function breakBlock(){

    const hit=
    getTargetBlock();

    if(!hit)return;

    const d=
    hit.object.userData;

    /*
       足元のブロックを
       壊して落ちないようにする
    */

    if(
        d.y<=0
    )return;

    removeBlock(
        d.x,
        d.y,
        d.z
    );

}


/* =========================================
   ブロックを置く
========================================= */

function placeBlock(){

    const hit=
    getTargetBlock();

    if(!hit)return;

    const d=
    hit.object.userData;

    const normal=
    hit.face.normal;

    const x=
    d.x+Math.round(normal.x);

    const y=
    d.y+Math.round(normal.y);

    const z=
    d.z+Math.round(normal.z);

    /*
       プレイヤーの中には
       ブロックを置かない
    */

    if(
        x+1>player.x-PLAYER_WIDTH/2 &&
        x<player.x+PLAYER_WIDTH/2 &&
        y+1>player.y &&
        y<player.y+PLAYER_HEIGHT &&
        z+1>player.z-PLAYER_DEPTH/2 &&
        z<player.z+PLAYER_DEPTH/2
    ){

        return;

    }

    addBlock(
        x,
        y,
        z,
        inventory[selected]
    );

}


/* =========================================
   ボタン
========================================= */

document
.getElementById("breakBtn")
.addEventListener(
"touchstart",
e=>{
    e.preventDefault();
    breakBlock();
},
{passive:false}
);


document
.getElementById("placeBtn")
.addEventListener(
"touchstart",
e=>{
    e.preventDefault();
    placeBlock();
},
{passive:false}
);


/* =========================================
   カメラ操作
========================================= */

let lookTouch=null;

let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
"touchstart",
e=>{

    if(e.touches.length===1){

        lookTouch=
        e.touches[0].identifier;

        lastX=e.touches[0].clientX;
        lastY=e.touches[0].clientY;

    }

},
{passive:false}
);


renderer.domElement.addEventListener(
"touchmove",
e=>{

    for(const t of e.changedTouches){

        if(t.identifier===lookTouch){

            const dx=
            t.clientX-lastX;

            const dy=
            t.clientY-lastY;

            player.yaw-=dx*.006;

            player.pitch-=dy*.004;

            player.pitch=
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    player.pitch
                )
            );

            lastX=t.clientX;
            lastY=t.clientY;

        }

    }

},
{passive:false}
);


/* =========================================
   キーボード
========================================= */

const keys={};

addEventListener(
"keydown",
e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key===" ")
        jump();

}
);

addEventListener(
"keyup",
e=>{

    keys[e.key.toLowerCase()]=false;

}
);


/* =========================================
   プレイヤー更新
========================================= */

function updatePlayer(dt){

    let forward=-joyY;
    let side=joyX;

    if(keys["w"])forward=1;
    if(keys["s"])forward=-1;
    if(keys["a"])side=-1;
    if(keys["d"])side=1;

    const speed=
    player.sprint
    ? 6
    : 3.5;

    let mx=
    Math.sin(player.yaw)*forward+
    Math.cos(player.yaw)*side;

    let mz=
    Math.cos(player.yaw)*forward-
    Math.sin(player.yaw)*side;

    const len=
    Math.sqrt(mx*mx+mz*mz);

    if(len>0){

        mx/=len;
        mz/=len;

    }

    const amount=
    speed*dt;

    /*
       小さく分割して移動することで
       ブロックをすり抜けにくくする
    */

    const steps=
    Math.max(
        1,
        Math.ceil(amount/.05)
    );

    const sx=
    mx*amount/steps;

    const sz=
    mz*amount/steps;

    for(let i=0;i<steps;i++){

        moveX(sx);
        moveZ(sz);

    }

    player.vy-=GRAVITY*dt;

    const vy=
    player.vy*dt;

    const ySteps=
    Math.max(
        1,
        Math.ceil(
            Math.abs(vy)/.05
        )
    );

    for(
        let i=0;
        i<ySteps;
        i++
    ){

        moveY(vy/ySteps);

    }


    /*
       落下したら復活
    */

    if(player.y<-20){

        respawn();

    }

}


/* =========================================
   カメラ更新
========================================= */

function updateCamera(){

    camera.position.set(
        player.x,
        player.y+1.55,
        player.z
    );

    camera.rotation.order=
    "YXZ";

    camera.rotation.y=
    player.yaw;

    camera.rotation.x=
    player.pitch;

}


/* =========================================
   遠距離ブロック表示
========================================= */

function updateRenderDistance(){

    for(const mesh of meshes.values()){

        const dx=
        mesh.position.x-player.x;

        const dz=
        mesh.position.z-player.z;

        const distance=
        Math.sqrt(
            dx*dx+dz*dz
        );

        mesh.visible=
        distance<
        RENDER_DISTANCE;

    }

}


/* =========================================
   昼夜
========================================= */

let worldTime=0;

function updateDayNight(dt){

    worldTime+=dt*.02;

    const angle=
    worldTime%(Math.PI*2);

    const sunY=
    Math.sin(angle);

    sun.position.set(
        Math.cos(angle)*60,
        sunY*60,
        Math.sin(angle)*60
    );

    const daylight=
    Math.max(
        .15,
        sunY*.5+.5
    );

    ambient.intensity=
    .25+
    daylight*.9;

    sun.intensity=
    daylight*1.8;

    if(sunY>0){

        scene.background=
        new THREE.Color(
            0x87ceeb
        );

        scene.fog.color=
        new THREE.Color(
            0x87ceeb
        );

        document
        .getElementById("timeText")
        .textContent="昼";

    }else{

        scene.background=
        new THREE.Color(
            0x10152e
        );

        scene.fog.color=
        new THREE.Color(
            0x10152e
        );

        document
        .getElementById("timeText")
        .textContent="夜";

    }

}


/* =========================================
   溶岩アニメーション
========================================= */

function animateLava(time){

    for(const mesh of meshes.values()){

        if(
            mesh.userData.type==="lava"
        ){

            const baseY=
            mesh.userData.y+.5;

            mesh.position.y=
            baseY+
            Math.sin(
                time*.003+
                mesh.userData.x+
                mesh.userData.z
            )*.025;

        }

    }

}


/* =========================================
   UI
========================================= */

function updateInfo(){

    document
    .getElementById("blockText")
    .textContent=
    BLOCKS[
        inventory[selected]
    ].name;

}

updateInfo();


/* =========================================
   セーブ
========================================= */

function saveGame(){

    const data={
        blocks:
        Array.from(
            blocks.entries()
        ),

        player:{
            x:player.x,
            y:player.y,
            z:player.z,
            yaw:player.yaw,
            pitch:player.pitch
        }
    };

    localStorage.setItem(
        "BLOCK_WORLD_SAVE",
        JSON.stringify(data)
    );

}


/* =========================================
   ロード
========================================= */

function loadGame(){

    const raw=
    localStorage.getItem(
        "BLOCK_WORLD_SAVE"
    );

    if(!raw){

        generateWorld();
        respawn();
        return;

    }

    try{

        const data=
        JSON.parse(raw);

        /*
           現在のワールドを消す
        */

        for(
            const mesh of meshes.values()
        ){

            scene.remove(mesh);

            mesh.geometry.dispose();

            mesh.material.dispose();

        }

        blocks.clear();
        meshes.clear();


        /*
           保存データから復元
        */

        for(
            const item of data.blocks
        ){

            const parts=
            item[0]
            .split(",")
            .map(Number);

            addBlock(
                parts[0],
                parts[1],
                parts[2],
                item[1]
            );

        }


        player.x=data.player.x;
        player.y=data.player.y;
        player.z=data.player.z;

        player.yaw=data.player.yaw;
        player.pitch=data.player.pitch;

    }
    catch(e){

        console.log(e);

        generateWorld();
        respawn();

    }

}


/* =========================================
   ゲーム開始
========================================= */

let started=false;

function startGame(load){

    document
    .getElementById("startScreen")
    .style.display="none";

    started=true;

    if(load){

        loadGame();

    }else{

        generateWorld();
        respawn();

    }

}


document
.getElementById("startBtn")
.addEventListener(
"click",
()=>{
    startGame(false);
}
);


document
.getElementById("loadBtn")
.addEventListener(
"click",
()=>{
    startGame(true);
}
);


/* =========================================
   自動セーブ
========================================= */

setInterval(
()=>{

    if(started){

        saveGame();

    }

},
10000
);


/* =========================================
   メインループ
========================================= */

let lastTime=
performance.now();


function loop(time){

    requestAnimationFrame(loop);

    if(!started){

        renderer.render(
            scene,
            camera
        );

        return;

    }

    let dt=
    (time-lastTime)/1000;

    lastTime=time;

    dt=
    Math.min(dt,.05);

    updatePlayer(dt);

    updateCamera();

    updateRenderDistance();

    updateDayNight(dt);

    animateLava(time);

    renderer.render(
        scene,
        camera
    );

}


requestAnimationFrame(loop);


/* =========================================
   リサイズ
========================================= */

addEventListener(
"resize",
()=>{

    camera.aspect=
    innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

}
);

}
</script>
