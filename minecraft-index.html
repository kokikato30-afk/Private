<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>BLOCK WORLD 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:24px;
    height:24px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:20;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 1px 3px #000;
}

#crosshair:before{
    width:2px;
    height:24px;
    left:11px;
}

#crosshair:after{
    width:24px;
    height:2px;
    top:11px;
}

#info{
    position:fixed;
    left:12px;
    top:12px;
    z-index:30;
    color:white;
    font-weight:bold;
    text-shadow:0 2px 4px black;
    font-size:14px;
}

#health{
    position:fixed;
    left:12px;
    top:65px;
    z-index:30;
    color:white;
    font-size:20px;
    text-shadow:0 2px 3px black;
}

#hotbar{
    position:fixed;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
    z-index:40;
}

.slot{
    width:55px;
    height:55px;
    border:3px solid white;
    background:rgba(0,0,0,.5);
    border-radius:8px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:12px;
    text-shadow:0 1px 2px black;
}

.slot.selected{
    border:4px solid yellow;
    transform:translateY(-5px);
}

.blockIcon{
    width:25px;
    height:25px;
    margin-bottom:2px;
    border:2px solid rgba(0,0,0,.3);
}

#joystick{
    position:fixed;
    left:20px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    border:3px solid rgba(255,255,255,.5);
    z-index:50;
}

#stick{
    position:absolute;
    width:60px;
    height:60px;
    left:37px;
    top:37px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
    border:2px solid white;
}

.control{
    position:fixed;
    z-index:50;
    width:68px;
    height:68px;
    border-radius:18px;
    border:2px solid white;
    background:rgba(0,0,0,.45);
    color:white;
    font-size:25px;
}

#jump{
    right:20px;
    bottom:120px;
}

#break{
    right:100px;
    bottom:30px;
}

#place{
    right:20px;
    bottom:30px;
}

#run{
    right:105px;
    bottom:120px;
    font-size:20px;
}

#save{
    position:fixed;
    right:15px;
    top:15px;
    z-index:60;
    padding:9px 13px;
    border-radius:12px;
    border:2px solid white;
    background:rgba(0,0,0,.45);
    color:white;
    font-weight:bold;
}

#message{
    position:fixed;
    left:50%;
    top:72%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 2px 4px black;
    z-index:100;
    opacity:0;
    transition:.2s;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="crosshair"></div>

<div id="info">
🌍 BLOCK WORLD 3D<br>
選択中: <span id="selectedName">草</span>
</div>

<div id="health">❤️❤️❤️❤️❤️</div>

<div id="message"></div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="jump" class="control">⬆️</button>
<button id="break" class="control">⛏️</button>
<button id="place" class="control">🧱</button>
<button id="run" class="control">🏃</button>

<button id="save">💾 保存</button>

<div id="hotbar"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* ==================================================
   THREE.JS
================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        30,
        80
    );

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .1,
        200
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document
.getElementById("game")
.appendChild(renderer.domElement);


/* ==================================================
   LIGHT
================================================== */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        1.5
    );

scene.add(ambient);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    30,50,20
);

sun.castShadow=true;

scene.add(sun);


/* ==================================================
   BLOCK MATERIAL
================================================== */

const materials={

    grass:
        new THREE.MeshLambertMaterial({
            color:0x4caf50
        }),

    dirt:
        new THREE.MeshLambertMaterial({
            color:0x8b5a2b
        }),

    stone:
        new THREE.MeshLambertMaterial({
            color:0x777777
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x9b5a2e
        }),

    leaves:
        new THREE.MeshLambertMaterial({
            color:0x238b35
        }),

    glass:
        new THREE.MeshLambertMaterial({
            color:0x9ee8ff,
            transparent:true,
            opacity:.45
        }),

    water:
        new THREE.MeshLambertMaterial({
            color:0x2e8bff,
            transparent:true,
            opacity:.65
        })
};

const blockNames={
    grass:"草",
    dirt:"土",
    stone:"石",
    wood:"木",
    glass:"ガラス"
};

const blockGeometry =
    new THREE.BoxGeometry(1,1,1);


/* ==================================================
   WORLD DATA
================================================== */

const blocks=[];

const blockMap=new Map();

function key(x,y,z){
    return x+","+y+","+z;
}

function addBlock(x,y,z,type){

    const k=key(x,y,z);

    if(blockMap.has(k))
        return;

    const mesh =
        new THREE.Mesh(
            blockGeometry,
            materials[type] ||
            materials.grass
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    mesh.userData.type=type;

    scene.add(mesh);

    blocks.push(mesh);

    blockMap.set(k,mesh);

    return mesh;
}

function removeBlock(mesh){

    scene.remove(mesh);

    const i=blocks.indexOf(mesh);

    if(i>=0)
        blocks.splice(i,1);

    blockMap.delete(
        key(
            Math.round(mesh.position.x),
            Math.round(mesh.position.y),
            Math.round(mesh.position.z)
        )
    );
}


/* ==================================================
   TERRAIN
================================================== */

const WORLD=22;

function terrainHeight(x,z){

    return Math.floor(
        2 +
        Math.sin(x*.28)*.8 +
        Math.cos(z*.24)*.8 +
        Math.sin((x+z)*.12)*.6
    );
}

function generateTerrain(){

    for(let x=-WORLD;x<=WORLD;x++){

        for(let z=-WORLD;z<=WORLD;z++){

            const h=terrainHeight(x,z);

            for(let y=0;y<=h;y++){

                let type;

                if(y===h)
                    type="grass";
                else if(y>=h-2)
                    type="dirt";
                else
                    type="stone";

                addBlock(
                    x,y,z,type
                );
            }
        }
    }
}

generateTerrain();


/* ==================================================
   TREES
================================================== */

function makeTree(x,z){

    const ground=
        terrainHeight(x,z);

    for(let y=ground+1;
        y<=ground+4;
        y++){

        addBlock(
            x,y,z,"wood"
        );
    }

    for(let dx=-2;dx<=2;dx++){

        for(let dz=-2;dz<=2;dz++){

            for(let dy=3;dy<=5;dy++){

                if(
                    Math.abs(dx)+
                    Math.abs(dz)+
                    Math.abs(dy-4)
                    <=3
                ){

                    addBlock(
                        x+dx,
                        ground+dy,
                        z+dz,
                        "leaves"
                    );
                }
            }
        }
    }
}

for(let i=0;i<28;i++){

    const x=
        Math.floor(
            (Math.random()-.5)*35
        );

    const z=
        Math.floor(
            (Math.random()-.5)*35
        );

    if(
        Math.abs(x)<4 &&
        Math.abs(z)<4
    )
        continue;

    makeTree(x,z);
}


/* ==================================================
   WATER
================================================== */

for(let x=-15;x<=15;x++){

    for(let z=-15;z<=15;z++){

        if(
            Math.abs(x)>6 &&
            Math.abs(z)>6 &&
            terrainHeight(x,z)<=1
        ){

            addBlock(
                x,2,z,"water"
            );
        }
    }
}


/* ==================================================
   PLAYER
================================================== */

const player={

    x:0,
    y:7,
    z:8,

    vx:0,
    vy:0,
    vz:0,

    width:.6,
    height:1.8,

    speed:.075,
    sprintSpeed:.13,

    jump:.23,

    grounded:false,

    health:5
};

let sprint=false;


/* ==================================================
   CAMERA
================================================== */

let yaw=0;
let pitch=0;


/* ==================================================
   COLLISION
   ★ここが今回の重要部分
================================================== */

/*
   プレイヤーを箱として扱います。

   X方向に動く
   ↓
   横のブロックに当たったら止める

   Z方向に動く
   ↓
   横のブロックに当たったら止める

   Y方向に動く
   ↓
   地面・天井に当たったら止める

   つまり、

        🧱
        🧍 ← 横から当たる！

   という判定も入っています。
*/


function isSolid(x,y,z){

    const b =
        blockMap.get(
            key(
                Math.floor(x),
                Math.floor(y),
                Math.floor(z)
            )
        );

    if(!b)
        return false;

    const type=b.userData.type;

    return type!=="water";
}


function collides(){

    const minX=
        player.x-player.width/2;

    const maxX=
        player.x+player.width/2;

    const minY=
        player.y;

    const maxY=
        player.y+player.height;

    const minZ=
        player.z-player.width/2;

    const maxZ=
        player.z+player.width/2;

    const startX=
        Math.floor(minX);

    const endX=
        Math.floor(maxX);

    const startY=
        Math.floor(minY);

    const endY=
        Math.floor(maxY);

    const startZ=
        Math.floor(minZ);

    const endZ=
        Math.floor(maxZ);

    for(
        let x=startX;
        x<=endX;
        x++
    ){

        for(
            let y=startY;
            y<=endY;
            y++
        ){

            for(
                let z=startZ;
                z<=endZ;
                z++
            ){

                if(isSolid(
                    x,y,z
                )){

                    return {
                        x,y,z
                    };
                }
            }
        }
    }

    return null;
}


/*
   X軸の衝突
*/

function moveX(dx){

    player.x+=dx;

    const hit=collides();

    if(!hit)
        return;

    if(dx>0){

        player.x=
            hit.x-
            player.width/2-
            .001;

    }else if(dx<0){

        player.x=
            hit.x+1+
            player.width/2+
            .001;
    }
}


/*
   Z軸の衝突
*/

function moveZ(dz){

    player.z+=dz;

    const hit=collides();

    if(!hit)
        return;

    if(dz>0){

        player.z=
            hit.z-
            player.width/2-
            .001;

    }else if(dz<0){

        player.z=
            hit.z+1+
            player.width/2+
            .001;
    }
}


/*
   Y軸の衝突
*/

function moveY(dy){

    player.y+=dy;

    const hit=collides();

    if(!hit){

        player.grounded=false;

        return;
    }

    if(dy>0){

        /* 天井 */

        player.y=
            hit.y-
            player.height-
            .001;

        player.vy=0;

    }else{

        /* 地面 */

        player.y=
            hit.y+1+
            .001;

        player.vy=0;

        player.grounded=true;
    }
}


/* ==================================================
   JOYSTICK
================================================== */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );

let joyX=0;
let joyY=0;
let joyId=null;

function joystickMove(x,y){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=42;

    const len=
        Math.sqrt(
            dx*dx+dy*dy
        );

    if(len>max){

        dx=
            dx/len*max;

        dy=
            dy/len*max;
    }

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;

    joyX=dx/max;
    joyY=dy/max;
}

joystick.addEventListener(
    "touchstart",
    e=>{

        const t=e.changedTouches[0];

        joyId=t.identifier;

        joystickMove(
            t.clientX,
            t.clientY
        );

        e.preventDefault();
    },
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    e=>{

        for(const t of e.changedTouches){

            if(t.identifier===joyId){

                joystickMove(
                    t.clientX,
                    t.clientY
                );
            }
        }

        e.preventDefault();
    },
    {passive:false}
);

joystick.addEventListener(
    "touchend",
    e=>{

        for(const t of e.changedTouches){

            if(t.identifier===joyId){

                joyId=null;
                joyX=0;
                joyY=0;

                stick.style.transform=
                    "translate(0,0)";
            }
        }
    }
);


/* ==================================================
   CAMERA TOUCH
================================================== */

let lookId=null;
let lastLookX=0;
let lastLookY=0;

renderer.domElement.addEventListener(
    "touchstart",
    e=>{

        for(const t of e.changedTouches){

            if(
                t.clientX>
                innerWidth*.35
            ){

                lookId=t.identifier;

                lastLookX=t.clientX;
                lastLookY=t.clientY;
            }
        }
    },
    {passive:false}
);

renderer.domElement.addEventListener(
    "touchmove",
    e=>{

        for(const t of e.touches){

            if(t.identifier!==lookId)
                continue;

            const dx=
                t.clientX-lastLookX;

            const dy=
                t.clientY-lastLookY;

            yaw-=dx*.004;
            pitch-=dy*.004;

            pitch=
                Math.max(
                    -1.45,
                    Math.min(
                        1.45,
                        pitch
                    )
                );

            lastLookX=t.clientX;
            lastLookY=t.clientY;

            e.preventDefault();
        }
    },
    {passive:false}
);

renderer.domElement.addEventListener(
    "touchend",
    e=>{

        for(const t of e.changedTouches){

            if(t.identifier===lookId)
                lookId=null;
        }
    }
);


/* ==================================================
   JUMP
================================================== */

document
.getElementById("jump")
.addEventListener(
    "touchstart",
    e=>{

        if(player.grounded){

            player.vy=
                player.jump;

            player.grounded=false;
        }

        e.preventDefault();
    },
    {passive:false}
);


/* ==================================================
   SPRINT
================================================== */

const runButton=
    document.getElementById("run");

runButton.addEventListener(
    "touchstart",
    e=>{

        sprint=true;

        e.preventDefault();
    },
    {passive:false}
);

runButton.addEventListener(
    "touchend",
    ()=>{
        sprint=false;
    }
);


/* ==================================================
   BLOCK TARGET
================================================== */

const raycaster=
    new THREE.Raycaster();

function targetBlock(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits=
        raycaster.intersectObjects(
            blocks
        );

    if(
        hits.length===0 ||
        hits[0].distance>6
    )
        return null;

    return hits[0];
}


/* ==================================================
   BREAK
================================================== */

let selected="grass";

function breakBlock(){

    const hit=targetBlock();

    if(!hit)
        return;

    const block=hit.object;

    if(
        block.userData.type==="water"
    )
        return;

    if(
        block.position.y<=0
    )
        return;

    removeBlock(block);

    showMessage(
        "⛏️ "+blockNames[
            block.userData.type
        ]+" を壊した！"
    );
}

document
.getElementById("break")
.addEventListener(
    "touchstart",
    e=>{

        breakBlock();

        e.preventDefault();
    },
    {passive:false}
);


/* ==================================================
   PLACE
================================================== */

function placeBlock(){

    const hit=targetBlock();

    if(!hit)
        return;

    const normal=
        hit.face.normal.clone();

    const p=
        hit.object.position.clone()
        .add(normal);

    const x=Math.round(p.x);
    const y=Math.round(p.y);
    const z=Math.round(p.z);

    if(blockMap.has(
        key(x,y,z)
    ))
        return;

    addBlock(
        x,y,z,
        selected
    );
}

document
.getElementById("place")
.addEventListener(
    "touchstart",
    e=>{

        placeBlock();

        e.preventDefault();
    },
    {passive:false}
);


/* ==================================================
   HOTBAR
================================================== */

const hotbar=
    document.getElementById(
        "hotbar"
    );

const items=[
    "grass",
    "dirt",
    "stone",
    "wood",
    "glass"
];

function createHotbar(){

    hotbar.innerHTML="";

    items.forEach(
        (type,index)=>{

            const slot=
                document.createElement(
                    "div"
                );

            slot.className="slot";

            if(type===selected)
                slot.classList.add(
                    "selected"
                );

            const icon=
                document.createElement(
                    "div"
                );

            icon.className=
                "blockIcon";

            icon.style.background=
                getColor(type);

            const text=
                document.createElement(
                    "div"
                );

            text.textContent=
                (index+1)+" "+blockNames[type];

            slot.appendChild(icon);
            slot.appendChild(text);

            slot.addEventListener(
                "touchstart",
                e=>{

                    selected=type;

                    updateHotbar();

                    e.preventDefault();
                },
                {passive:false}
            );

            hotbar.appendChild(slot);
        }
    );
}

function getColor(type){

    const colors={
        grass:"#4caf50",
        dirt:"#8b5a2b",
        stone:"#777",
        wood:"#9b5a2e",
        glass:"#9ee8ff"
    };

    return colors[type];
}

function updateHotbar(){

    createHotbar();

    document
    .getElementById(
        "selectedName"
    )
    .textContent=
        blockNames[selected];
}

createHotbar();


/* ==================================================
   PLAYER UPDATE
================================================== */

function updatePlayer(){

    let speed=
        sprint ?
        player.sprintSpeed :
        player.speed;

    const forwardX=
        -Math.sin(yaw);

    const forwardZ=
        -Math.cos(yaw);

    const rightX=
        Math.cos(yaw);

    const rightZ=
        -Math.sin(yaw);

    const moveX=
        forwardX*(-joyY)+
        rightX*joyX;

    const moveZ=
        forwardZ*(-joyY)+
        rightZ*joyX;

    /*
       ★ XとZを別々に処理

       これが壁すり抜け防止のポイント
    */

    moveX *= speed;
    moveZ *= speed;

    moveXStep(moveX);
    moveZStep(moveZ);


    /* 重力 */

    player.vy-=.012;

    if(player.vy<-.5)
        player.vy=-.5;

    moveY(
        player.vy
    );


    /* 落下した場合 */

    if(player.y<-20){

        player.x=0;
        player.y=8;
        player.z=8;
        player.vy=0;
    }


    /* カメラ */

    camera.position.set(
        player.x,
        player.y+1.62,
        player.z
    );

    camera.rotation.order=
        "YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
}


/*
   小さなステップに分けることで
   高速移動時のすり抜けも防ぎやすくする
*/

function moveXStep(dx){

    const steps=
        Math.max(
            1,
            Math.ceil(
                Math.abs(dx)/.15
            )
        );

    const step=dx/steps;

    for(let i=0;i<steps;i++){

        moveX(step);
    }
}

function moveZStep(dz){

    const steps=
        Math.max(
            1,
            Math.ceil(
                Math.abs(dz)/.15
            )
        );

    const step=dz/steps;

    for(let i=0;i<steps;i++){

        moveZ(step);
    }
}


/* ==================================================
   DAY / NIGHT
================================================== */

let worldTime=0;

function updateDayNight(){

    worldTime+=.0007;

    const angle=
        worldTime;

    const sx=
        Math.cos(angle)*45;

    const sy=
        Math.sin(angle)*45+20;

    const sz=
        Math.sin(angle)*30;

    sun.position.set(
        sx,sy,sz
    );

    const daylight=
        Math.max(
            .12,
            Math.sin(angle)*.8+.2
        );

    ambient.intensity=
        daylight*1.5;

    sun.intensity=
        daylight*2;

    const sky=
        new THREE.Color();

    sky.setHSL(
        .56,
        .55,
        .45*daylight+.05
    );

    scene.background=sky;
    scene.fog.color=sky;
}


/* ==================================================
   HEALTH
================================================== */

function updateHealth(){

    let text="";

    for(let i=0;i<5;i++){

        text+=
            i<player.health
            ? "❤️"
            : "🖤";
    }

    document
    .getElementById(
        "health"
    )
    .textContent=text;
}


/* ==================================================
   MESSAGE
================================================== */

let messageTimer;

function showMessage(text){

    const m=
        document.getElementById(
            "message"
        );

    m.textContent=text;
    m.style.opacity=1;

    clearTimeout(messageTimer);

    messageTimer=
        setTimeout(
            ()=>{
                m.style.opacity=0;
            },
            1200
        );
}


/* ==================================================
   SAVE
================================================== */

document
.getElementById("save")
.addEventListener(
    "click",
    saveGame
);

function saveGame(){

    const data={

        x:player.x,
        y:player.y,
        z:player.z,

        yaw:yaw,
        pitch:pitch,

        selected:selected,

        time:worldTime,

        health:player.health
    };

    localStorage.setItem(
        "BLOCK_WORLD_SAVE",
        JSON.stringify(data)
    );

    showMessage(
        "💾 ワールドを保存しました！"
    );
}


function loadGame(){

    const data=
        localStorage.getItem(
            "BLOCK_WORLD_SAVE"
        );

    if(!data)
        return;

    try{

        const d=
            JSON.parse(data);

        player.x=d.x;
        player.y=d.y;
        player.z=d.z;

        yaw=d.yaw||0;
        pitch=d.pitch||0;

        selected=
            d.selected||"grass";

        worldTime=
            d.time||0;

        player.health=
            d.health||5;

        updateHotbar();
        updateHealth();

    }catch(e){

        console.log(
            "セーブデータ読み込み失敗",
            e
        );
    }
}

loadGame();


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* ==================================================
   GAME LOOP
================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    updateDayNight();

    updateHealth();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
