<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>DINO RUN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:monospace;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    color:#222;
}

/* =========================
   スコア
========================= */

#score{
    position:absolute;
    top:15px;
    right:20px;
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
    z-index:30;
}

#hi{
    position:absolute;
    top:43px;
    right:20px;
    font-size:14px;
    letter-spacing:1px;
    z-index:30;
}

/* =========================
   雲
========================= */

.cloud{
    position:absolute;
    width:65px;
    height:4px;
    background:#777;
    opacity:.35;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:#777;
    border-radius:50%;
}

.cloud::before{
    width:25px;
    height:12px;
    left:8px;
    top:-8px;
}

.cloud::after{
    width:35px;
    height:15px;
    right:5px;
    top:-11px;
}

/* =========================
   プレイヤー
========================= */

#player{
    position:absolute;
    width:55px;
    height:60px;
    left:80px;
    bottom:75px;
    z-index:15;
}

/* 頭 */

.dino-head{
    position:absolute;
    width:39px;
    height:31px;
    right:0;
    top:2px;
    background:#222;
}

.dino-head::after{
    content:"";
    position:absolute;
    width:12px;
    height:5px;
    background:#fff;
    right:0;
    bottom:3px;
}

/* 目 */

.dino-eye{
    position:absolute;
    width:5px;
    height:5px;
    background:#fff;
    right:8px;
    top:7px;
}

/* 胴体 */

.dino-body{
    position:absolute;
    width:36px;
    height:35px;
    right:4px;
    top:27px;
    background:#222;
}

/* しっぽ */

.dino-tail{
    position:absolute;
    width:25px;
    height:9px;
    left:1px;
    top:39px;
    background:#222;
    transform:rotate(-20deg);
}

/* 足 */

.leg{
    position:absolute;
    width:9px;
    height:20px;
    background:#222;
    bottom:0;
}

.leg1{
    left:29px;
}

.leg2{
    left:43px;
}

/* =========================
   地面
========================= */

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:75px;
    border-top:3px solid #222;
    background:#fff;
    z-index:10;
}

#groundPattern{
    position:absolute;
    top:13px;
    width:100%;
    height:4px;

    background:repeating-linear-gradient(
        90deg,
        #222 0px,
        #222 35px,
        transparent 35px,
        transparent 65px
    );
}

/* =========================
   障害物
========================= */

.cactus{
    position:absolute;
    bottom:75px;
    width:20px;
    height:48px;
    background:#222;
    z-index:12;
}

/* 腕 */

.cactus::before,
.cactus::after{
    content:"";
    position:absolute;
    background:#222;
}

.cactus::before{
    width:13px;
    height:25px;
    left:-10px;
    top:16px;
}

.cactus::after{
    width:13px;
    height:20px;
    right:-9px;
    top:6px;
}

/* =========================
   鳥
========================= */

.bird{
    position:absolute;
    width:45px;
    height:25px;
    z-index:12;
}

.bird-body{
    position:absolute;
    width:28px;
    height:14px;
    left:9px;
    top:6px;
    background:#222;
}

.bird-wing{
    position:absolute;
    width:18px;
    height:7px;
    background:#222;
    left:0;
    top:0;
    transform:rotate(-25deg);
}

.bird-wing2{
    position:absolute;
    width:18px;
    height:7px;
    background:#222;
    right:0;
    top:3px;
    transform:rotate(25deg);
}

.bird-eye{
    position:absolute;
    width:4px;
    height:4px;
    background:#fff;
    right:4px;
    top:3px;
}

/* =========================
   スタート
========================= */

#start{
    position:absolute;
    top:38%;
    width:100%;
    text-align:center;
    font-size:20px;
    letter-spacing:1px;
    z-index:40;
    animation:blink 1.2s infinite;
}

@keyframes blink{
    50%{
        opacity:.35;
    }
}

/* =========================
   ゲームオーバー
========================= */

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.88);
    z-index:100;

    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#gameOver.show{
    display:flex;
}

#gameOver h1{
    font-size:42px;
    margin-bottom:10px;
}

#gameOver p{
    font-size:20px;
    margin-bottom:25px;
}

#restart{
    background:#222;
    color:#fff;
    border:0;
    padding:13px 28px;
    font-family:monospace;
    font-size:17px;
}

/* =========================
   JUMP
========================= */

#jump{
    position:absolute;
    right:20px;
    bottom:95px;

    width:82px;
    height:82px;

    border:3px solid #222;
    border-radius:50%;

    background:#fff;

    font-family:monospace;
    font-weight:bold;

    z-index:50;
}

#jump:active{
    background:#ddd;
    transform:scale(.92);
}

/* スマホでは少し小さく */

@media(max-width:500px){

    #player{
        left:55px;
    }

    #jump{
        width:75px;
        height:75px;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- 雲 -->
    <div class="cloud"
         style="left:15%;top:18%;"></div>

    <div class="cloud"
         style="left:55%;top:28%;transform:scale(.8);"></div>

    <div class="cloud"
         style="left:85%;top:13%;transform:scale(.6);"></div>

    <!-- スコア -->
    <div id="score">00000</div>
    <div id="hi">HI 00000</div>

    <!-- スタート -->
    <div id="start">
        TAP / SPACE / ↑
    </div>

    <!-- プレイヤー -->
    <div id="player">

        <div class="dino-tail"></div>

        <div class="dino-head">
            <div class="dino-eye"></div>
        </div>

        <div class="dino-body"></div>

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>

    </div>

    <!-- 地面 -->
    <div id="ground">
        <div id="groundPattern"></div>
    </div>

    <!-- ジャンプ -->
    <button id="jump">JUMP</button>

    <!-- GAME OVER -->
    <div id="gameOver">

        <h1>GAME OVER</h1>

        <p id="finalScore">
            SCORE 00000
        </p>

        <button id="restart">
            RESTART
        </button>

    </div>

</div>

<script>

/* =====================================================
   DINO RUN
===================================================== */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const hiText =
    document.getElementById("hi");

const startText =
    document.getElementById("start");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const restart =
    document.getElementById("restart");

const jumpButton =
    document.getElementById("jump");


/* =====================================================
   状態
===================================================== */

let started = false;
let running = false;

let playerY = 0;
let velocityY = 0;

const gravity = 0.78;
const jumpPower = 14;

let speed = 6;

let score = 0;

let obstacles = [];

let spawnTimer = 0;

let lastTime = 0;


/* =====================================================
   難易度
===================================================== */

let level = 1;


/* =====================================================
   ハイスコア
===================================================== */

let highScore =
    Number(
        localStorage.getItem("dinoHighScore")
    ) || 0;

hiText.textContent =
    "HI " +
    String(highScore).padStart(5,"0");


/* =====================================================
   ジャンプ
===================================================== */

function jump(){

    if(!started){

        startGame();

        return;
    }

    if(!running) return;

    /*
       地面にいるときだけジャンプ
    */

    if(playerY <= 1){

        velocityY = jumpPower;

    }
}


/* =====================================================
   ゲーム開始
===================================================== */

function startGame(){

    if(started) return;

    started = true;
    running = true;

    startText.style.display = "none";

    lastTime = performance.now();

    requestAnimationFrame(loop);
}


/* =====================================================
   サボテン生成
===================================================== */

function createCactus(count = 1){

    const group = [];

    for(let i = 0; i < count; i++){

        const cactus =
            document.createElement("div");

        cactus.className = "cactus";

        const x =
            game.clientWidth +
            30 +
            i * 28;

        cactus.style.left =
            x + "px";

        game.appendChild(cactus);

        group.push({
            element:cactus,
            x:x
        });

        obstacles.push({
            element:cactus,
            x:x,
            type:"cactus"
        });
    }
}


/* =====================================================
   鳥生成
===================================================== */

function createBird(){

    const bird =
        document.createElement("div");

    bird.className = "bird";

    /*
       低・中・高の3種類
    */

    const heights = [
        125,
        165,
        205
    ];

    const height =
        heights[
            Math.floor(
                Math.random() *
                heights.length
            )
        ];

    bird.style.left =
        (game.clientWidth + 50) + "px";

    bird.style.bottom =
        height + "px";

    bird.innerHTML = `
        <div class="bird-body">
            <div class="bird-eye"></div>
        </div>
        <div class="bird-wing"></div>
        <div class="bird-wing2"></div>
    `;

    game.appendChild(bird);

    obstacles.push({

        element:bird,

        x:game.clientWidth + 50,

        type:"bird"

    });
}


/* =====================================================
   障害物生成
===================================================== */

function spawnObstacle(){

    /*
       レベルによって種類を変える
    */

    const r = Math.random();


    /* レベル4以降 → 鳥 */

    if(level >= 4 && r < 0.28){

        createBird();

        return;
    }


    /*
       3連サボテン
    */

    if(level >= 3 && r < 0.35){

        createCactus(3);

        return;
    }


    /*
       2連サボテン
    */

    if(level >= 2 && r < 0.5){

        createCactus(2);

        return;
    }


    /* 通常 */

    createCactus(1);
}


/* =====================================================
   当たり判定
===================================================== */

function collision(a,b){

    const ar =
        a.getBoundingClientRect();

    const br =
        b.getBoundingClientRect();

    /*
       少し余白を作って、
       見た目より厳しすぎない判定
    */

    return !(
        ar.right - 8 < br.left + 5 ||
        ar.left + 8 > br.right - 5 ||
        ar.bottom - 6 < br.top + 5 ||
        ar.top + 6 > br.bottom - 5
    );
}


/* =====================================================
   ゲームオーバー
===================================================== */

function endGame(){

    running = false;

    const final =
        Math.floor(score);

    finalScore.textContent =
        "SCORE " +
        String(final).padStart(5,"0");


    if(final > highScore){

        highScore = final;

        localStorage.setItem(
            "dinoHighScore",
            highScore
        );

        hiText.textContent =
            "HI " +
            String(highScore).padStart(5,"0");
    }

    gameOver.classList.add("show");
}


/* =====================================================
   リセット
===================================================== */

function resetGame(){

    obstacles.forEach(
        o => o.element.remove()
    );

    obstacles = [];

    playerY = 0;

    velocityY = 0;

    score = 0;

    speed = 6;

    level = 1;

    spawnTimer = 0;

    started = false;

    running = false;

    player.style.transform =
        "translateY(0px)";

    scoreText.textContent =
        "00000";

    gameOver.classList.remove("show");

    startText.style.display =
        "block";
}


/* =====================================================
   メインループ
===================================================== */

function loop(time){

    if(!running) return;


    let delta =
        (time - lastTime) / 16.67;

    delta =
        Math.min(delta,2);

    lastTime = time;


    /* ==========================================
       ジャンプ物理
    ========================================== */

    velocityY -=
        gravity * delta;

    playerY +=
        velocityY * delta;


    if(playerY < 0){

        playerY = 0;

        velocityY = 0;
    }


    player.style.transform =
        `translateY(${-playerY}px)`;


    /* ==========================================
       スコア
    ========================================== */

    score +=
        0.13 * delta;

    scoreText.textContent =
        String(
            Math.floor(score)
        ).padStart(5,"0");


    /* ==========================================
       レベルアップ
    ========================================== */

    /*
       100点ごとに難しくする
    */

    const newLevel =
        Math.floor(score / 100) + 1;


    if(newLevel !== level){

        level = newLevel;

        /*
           速度アップ
        */

        speed =
            Math.min(
                6 + (level - 1) * 0.8,
                14
            );
    }


    /* ==========================================
       障害物生成間隔
    ========================================== */

    spawnTimer -= delta;


    if(spawnTimer <= 0){

        spawnObstacle();


        /*
           レベルが上がるほど
           次の障害物まで短くする
        */

        const base =
            100 - level * 4;

        spawnTimer =
            Math.max(
                52,
                base +
                Math.random() * 45
            );
    }


    /* ==========================================
       障害物移動
    ========================================== */

    for(
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ){

        const obstacle =
            obstacles[i];


        obstacle.x -=
            speed * delta;


        obstacle.element.style.left =
            obstacle.x + "px";


        /* 当たり判定 */

        if(
            collision(
                player,
                obstacle.element
            )
        ){

            endGame();

            return;
        }


        /* 画面外 */

        if(
            obstacle.x < -100
        ){

            obstacle.element.remove();

            obstacles.splice(i,1);
        }
    }


    requestAnimationFrame(loop);
}


/* =====================================================
   キーボード
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();
        }
    }
);


/* =====================================================
   タップ
===================================================== */

game.addEventListener(
    "pointerdown",
    function(e){

        /*
           ボタンを押した場合は
           ここでは処理しない
        */

        if(
            e.target === jumpButton ||
            e.target === restart
        ){

            return;
        }

        jump();
    }
);


/* =====================================================
   JUMPボタン
===================================================== */

jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();
    }
);


/* =====================================================
   RESTART
===================================================== */

restart.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        resetGame();
    }
);

</script>

</body>
</html>
