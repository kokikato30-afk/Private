<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =====================================================
	設定
===================================================== */

const CHUNK_SIZE = 16;

/*
	表示チャンク数を制限。
	前のバージョンよりかなり軽い。
*/
const RENDER_DISTANCE = 2;

/*
	世界のチャンク範囲。
*/
const WORLD_CHUNKS = 6;

/*
	一度に作るチャンク。
*/
const MAX_WORLD_HEIGHT = 16;

/* =====================================================
	Renderer
===================================================== */

const canvas =
	document.getElementById("game");

const renderer =
	new THREE.WebGLRenderer({
		canvas,
		antialias:false,
		powerPreference:"high-performance"
	});

renderer.setPixelRatio(
		Math.min(window.devicePixelRatio,1.25)
	);

renderer.setSize(
	window.innerWidth,
	window.innerHeight
);

renderer.outputColorSpace =
	THREE.SRGBColorSpace;

/* =====================================================
	Scene
===================================================== */

const scene =
	new THREE.Scene();

scene.background =
	new THREE.Color(0x87ceeb);

scene.fog =
	new THREE.Fog(
		0x87ceeb,
		18,
		48
	);

/* =====================================================
	Camera
===================================================== */

const camera =
	new THREE.PerspectiveCamera(
		72,
		window.innerWidth /
		window.innerHeight,
		0.05,
		80
	);

camera.rotation.order =
	"YXZ";

/* =====================================================
	Lighting
===================================================== */

scene.add(
	new THREE.HemisphereLight(
		0xffffff,
		0x607044,
		1.45
	)
);

const sun =
	new THREE.DirectionalLight(
		0xffffff,
		1.7
	);

sun.position.set(
	-20,
	40,
	-15
);

scene.add(sun);

/* =====================================================
	Texture Generator
	16x16の超軽量ピクセルテクスチャ
===================================================== */

function createTexture(
	base,
	dark,
	light
){

	const c =
		document.createElement("canvas");

	c.width=16;
	c.height=16;

	const ctx =
		c.getContext("2d");

	ctx.fillStyle=base;
	ctx.fillRect(
		0,0,16,16
	);

	for(let i=0;i<38;i++){

		const x =
			Math.floor(
				Math.random()*16
			);

		const y =
			Math.floor(
				Math.random()*16
			);

		const size =
			Math.random()<.8
			?1
			:2;

		ctx.fillStyle =
			Math.random()<.55
			?dark
			:light;

		ctx.fillRect(
			x,y,size,size
		);

	}

	const texture =
		new THREE.CanvasTexture(c);

	texture.magFilter =
		THREE.NearestFilter;

	texture.minFilter =
		THREE.NearestFilter;

	texture.colorSpace =
		THREE.SRGBColorSpace;

	return texture;
}

/*
	軽量CC0系ピクセルアート風テクスチャ。
*/
const textures={

	grassTop:
		createTexture(
			"#5cae3b",
			"#3e842c",
			"#78c64c"
		),

	grassSide:
		createTexture(
			"#6a9d3e",
			"#4d792f",
			"#7fb94e"
		),

	dirt:
		createTexture(
			"#79502f",
			"#5c3922",
			"#95623a"
		),

	stone:
		createTexture(
			"#858585",
			"#666666",
			"#a1a1a1"
		),

	wood:
		createTexture(
			"#9a6338",
			"#704225",
			"#b87843"
		),

	leaves:
		createTexture(
			"#438d35",
			"#2c6825",
			"#5cae42"
		),

	sand:
		createTexture(
			"#d7c17b",
			"#b59d5d",
			"#e7d494"
		)
};

/* =====================================================
	Block
===================================================== */

const BLOCK_TYPES = {

	grass:0,
	dirt:1,
	stone:2,
	wood:3,
	leaves:4,
	sand:5

};

const BLOCK_NAMES=[
	"grass",
	"dirt",
	"stone",
	"wood",
	"leaves",
	"sand"
];

function makeMaterial(texture){

	return new THREE.MeshLambertMaterial({
		map:texture
	});

}

const materials={

	grassTop:
		makeMaterial(textures.grassTop),

	grassSide:
		makeMaterial(textures.grassSide),

	dirt:
		makeMaterial(textures.dirt),

	stone:
		makeMaterial(textures.stone),

	wood:
		makeMaterial(textures.wood),

	leaves:
		new THREE.MeshLambertMaterial({
			map:textures.leaves,
			transparent:true,
			opacity:.9
		}),

	sand:
		makeMaterial(textures.sand)

};

/* =====================================================
	World Data
===================================================== */

const world =
	new Map();

function blockKey(x,y,z){

	return x+","+y+","+z;

}

function setBlock(
	x,y,z,type
){

	if(
		y<0 ||
		y>=MAX_WORLD_HEIGHT
	){
		return;
	}

	world.set(
		blockKey(x,y,z),
		type
	);

}

function getBlock(
	x,y,z
){

	return world.get(
		blockKey(x,y,z)
	);

}

function removeBlock(
	x,y,z
){

	world.delete(
		blockKey(x,y,z)
	);

}

/* =====================================================
	軽量Terrain
===================================================== */

function terrainHeight(x,z){

	const a =
		Math.sin(x*.18)*1.7;

	const b =
		Math.cos(z*.15)*1.5;

	const c =
		Math.sin(
			(x+z)*.08
		)*1.2;

	return Math.max(
		2,
		Math.min(
			8,
			Math.floor(
				4+a+b+c
			)
		)
	);

}

function generateWorld(){

	const radius =
		WORLD_CHUNKS *
		CHUNK_SIZE;

	for(
		let x=-radius;
		x<=radius;
		x++
	){

		for(
			let z=-radius;
			z<=radius;
			z++
		){

			const h =
				terrainHeight(x,z);

			for(
				let y=0;
				y<=h;
				y++
			){

				let type;

				if(y===h){

					type =
						BLOCK_TYPES.grass;

				}else if(
					y>=h-2
				){

					type =
						BLOCK_TYPES.dirt;

				}else{

					type =
						BLOCK_TYPES.stone;

				}

				setBlock(
					x,y,z,type
				);

			}

			/*
				少量の木。
			*/
			if(
				Math.abs(x)>3 &&
				Math.abs(z)>3 &&
				(
					(x*13+z*7)%31===0
				) &&
				h>=4
			){

				for(
					let y=1;
					y<=3;
					y++
				){

					setBlock(
						x,
						h+y,
						z,
						BLOCK_TYPES.wood
					);

				}

				for(
					let dx=-1;
					dx<=1;
					dx++
				){

					for(
						let dz=-1;
						dz<=1;
						dz++
					){

						for(
							let dy=3;
							dy<=4;
							dy++
						){

							if(
								Math.abs(dx)+
								Math.abs(dz)<=2
							){

								setBlock(
									x+dx,
									h+dy,
									z+dz,
									BLOCK_TYPES.leaves
								);

							}

						}

					}

				}

			}

		}

	}

}

/* =====================================================
	Face Mesh System
	不要な面を作らない
===================================================== */

const worldGroup =
	new THREE.Group();

scene.add(worldGroup);

const cubeGeometry =
	new THREE.BoxGeometry(
		1,1,1
	);

function isSolid(
	x,y,z
){

	return getBlock(
		x,y,z
	)!==undefined;

}

/*
	隠れているブロック面を
	作らない。
*/
function visibleBlock(
	x,y,z
){

	return (

		!isSolid(x+1,y,z) ||
		!isSolid(x-1,y,z) ||
		!isSolid(x,y+1,z) ||
		!isSolid(x,y-1,z) ||
		!isSolid(x,y,z+1) ||
		!isSolid(x,y,z-1)

	);

}

/*
	近距離チャンクだけ描画。
*/
function rebuildWorld(){

	worldGroup.clear();

	const px =
		Math.floor(player.x);

	const pz =
		Math.floor(player.z);

	const maxDistance =
		RENDER_DISTANCE *
		CHUNK_SIZE;

	for(
		const [key,type]
		of world
	){

		const parts =
			key.split(",")
			.map(Number);

		const x=parts[0];
		const y=parts[1];
		const z=parts[2];

		if(
			Math.abs(x-px)>
			maxDistance ||
			Math.abs(z-pz)>
			maxDistance
		){
			continue;
		}

		if(
			!visibleBlock(x,y,z)
		){
			continue;
		}

		const mesh =
			new THREE.Mesh(
				cubeGeometry,
				getMaterials(type)
			);

		mesh.position.set(
			x+.5,
			y+.5,
			z+.5
		);

		mesh.userData={
			x,y,z,type
		};

		worldGroup.add(mesh);

	}

}

/* =====================================================
	Materials per block
===================================================== */

const materialCache={};

function getMaterials(type){

	if(materialCache[type]){
		return materialCache[type];
	}

	if(
		type===
		BLOCK_TYPES.grass
	){

		materialCache[type]=[
			materials.grassSide,
			materials.grassSide,
			materials.grassTop,
			materials.dirt,
			materials.grassSide,
			materials.grassSide
		];

	}
	else if(
		type===
		BLOCK_TYPES.dirt
	){

		materialCache[type]=
			Array(6).fill(
				materials.dirt
			);

	}
	else if(
		type===
		BLOCK_TYPES.stone
	){

		materialCache[type]=
			Array(6).fill(
				materials.stone
			);

	}
	else if(
		type===
		BLOCK_TYPES.wood
	){

		materialCache[type]=
			Array(6).fill(
				materials.wood
			);

	}
	else if(
		type===
		BLOCK_TYPES.leaves
	){

		materialCache[type]=
			Array(6).fill(
				materials.leaves
			);

	}
	else{

		materialCache[type]=
			Array(6).fill(
				materials.sand
			);

	}

	return materialCache[type];

}

/* =====================================================
	Player
===================================================== */

const player={

	x:.5,
	y:7,
	z:.5,

	vy:0,

	yaw:0,
	pitch:0,

	onGround:false,

	speed:4.2,
	runSpeed:6.5

};

const PLAYER_HEIGHT=1.8;
const PLAYER_RADIUS=.28;

/* =====================================================
	Collision
===================================================== */

function collides(
	px,py,pz
){

	const minX=
		Math.floor(
			px-PLAYER_RADIUS
		);

	const maxX=
		Math.floor(
			px+PLAYER_RADIUS
		);

	const minY=
		Math.floor(py);

	const maxY=
		Math.floor(
			py+PLAYER_HEIGHT
		);

	const minZ=
		Math.floor(
			pz-PLAYER_RADIUS
		);

	const maxZ=
		Math.floor(
			pz+PLAYER_RADIUS
		);

	for(
		let x=minX;
		x<=maxX;
		x++
	){

		for(
			let y=minY;
			y<=maxY;
			y++
		){

			for(
				let z=minZ;
				z<=maxZ;
				z++
			){

				if(
					isSolid(x,y,z)
				){
					return true;
				}

			}

		}

	}

	return false;

}

function moveAxis(
	axis,
	amount
){

	const steps =
		Math.max(
			1,
			Math.ceil(
				Math.abs(amount)/.1
			)
		);

	const step =
		amount/steps;

	for(
		let i=0;
		i<steps;
		i++
	){

		let x=player.x;
		let y=player.y;
		let z=player.z;

		if(axis==="x")x+=step;
		if(axis==="y")y+=step;
		if(axis==="z")z+=step;

		if(
			!collides(x,y,z)
		){

			player.x=x;
			player.y=y;
			player.z=z;

		}
		else{

			if(axis==="y"){

				if(step<0){
					player.onGround=true;
				}

				player.vy=0;

			}

			return;

		}

	}

}

/* =====================================================
	Input
===================================================== */

const keys={};

window.addEventListener(
	"keydown",
	e=>{

		keys[e.code]=true;

		if(e.code==="Space"){
			e.preventDefault();
			jump();
		}

		if(
			e.code.startsWith("Digit")
		){

			const n =
				Number(
					e.code.substring(5)
				)-1;

			if(
				n>=0 &&
				n<BLOCK_NAMES.length
			){

				selectedBlock=n;
				updateHotbar();

			}

		}

	}
);

window.addEventListener(
	"keyup",
	e=>{
		keys[e.code]=false;
	}
);

/* =====================================================
	Joystick
===================================================== */

const joystick =
	document.getElementById(
		"joystick"
	);

const stick =
	document.getElementById(
		"stick"
	);

let joyX=0;
let joyY=0;
let joyActive=false;

function updateJoy(e){

	const r =
		joystick.getBoundingClientRect();

	let x =
		e.clientX-
		(r.left+r.width/2);

	let y =
		e.clientY-
		(r.top+r.height/2);

	const max =
		r.width*.38;

	const len =
		Math.sqrt(
			x*x+y*y
		);

	if(len>max){

		x=x/len*max;
		y=y/len*max;

	}

	joyX=x/max;
	joyY=y/max;

	stick.style.left =
		(50+joyX*38)+"%";

	stick.style.top =
		(50+joyY*38)+"%";

}

function resetJoy(){

	joyX=0;
	joyY=0;
	joyActive=false;

	stick.style.left="50%";
	stick.style.top="50%";

}

joystick.addEventListener(
	"pointerdown",
	e=>{

		joyActive=true;

		joystick.setPointerCapture(
			e.pointerId
		);

		updateJoy(e);

	}
);

joystick.addEventListener(
	"pointermove",
	e=>{

		if(joyActive){
			updateJoy(e);
		}

	}
);

joystick.addEventListener(
	"pointerup",
	resetJoy
);

joystick.addEventListener(
	"pointercancel",
	resetJoy
);

/* =====================================================
	Touch Look
===================================================== */

const look =
	document.getElementById(
		"look"
	);

let lookActive=false;
let lastX=0;
let lastY=0;

look.addEventListener(
	"pointerdown",
	e=>{

		lookActive=true;

		lastX=e.clientX;
		lastY=e.clientY;

		look.setPointerCapture(
			e.pointerId
		);

	}
);

look.addEventListener(
	"pointermove",
	e=>{

		if(!lookActive)return;

		const dx =
			e.clientX-lastX;

		const dy =
			e.clientY-lastY;

		lastX=e.clientX;
		lastY=e.clientY;

		player.yaw -=
			dx*.004;

		player.pitch -=
			dy*.004;

		player.pitch =
			Math.max(
				-Math.PI/2+.05,
				Math.min(
					Math.PI/2-.05,
					player.pitch
				)
			);

	}
);

look.addEventListener(
	"pointerup",
	()=>{
		lookActive=false;
	}
);

/* =====================================================
	Buttons
===================================================== */

function bindButton(
	id,
	fn
){

	document
		.getElementById(id)
		.addEventListener(
			"pointerdown",
			e=>{
				e.preventDefault();
				fn();
			}
		);

}

function jump(){

	if(player.onGround){

		player.vy=6.8;
		player.onGround=false;

	}

}

let running=false;

bindButton(
	"jump",
	jump
);

bindButton(
	"run",
	()=>{

		running=!running;

		document
			.getElementById(
				"run"
			)
			.textContent =
			running
			?"走る中"
			:"走る";

	}
);

/* =====================================================
	Raycast
===================================================== */

const raycaster =
	new THREE.Raycaster();

function targetBlock(){

	raycaster.setFromCamera(
		new THREE.Vector2(0,0),
		camera
	);

	const hits =
		raycaster.intersectObjects(
			worldGroup.children,
			false
		);

	if(!hits.length){
		return null;
	}

	const hit=hits[0];

	if(hit.distance>6){
		return null;
	}

	return hit;

}

/* =====================================================
	Break
===================================================== */

bindButton(
	"break",
	()=>{

		const hit =
			targetBlock();

		if(!hit)return;

		const d =
			hit.object.userData;

		if(d.y<=0)return;

		removeBlock(
			d.x,
			d.y,
			d.z
		);

		rebuildWorld();

	}
);

/* =====================================================
	Place
===================================================== */

bindButton(
	"place",
	()=>{

		const hit =
			targetBlock();

		if(!hit)return;

		const d =
			hit.object.userData;

		const n =
			hit.face.normal;

		const x =
			d.x+
			Math.round(n.x);

		const y =
			d.y+
			Math.round(n.y);

		const z =
			d.z+
			Math.round(n.z);

		if(
			getBlock(x,y,z)!==
			undefined
		){
			return;
		}

		if(
			x+1>player.x-PLAYER_RADIUS &&
			x<player.x+PLAYER_RADIUS &&
			y+1>player.y &&
			y<player.y+PLAYER_HEIGHT &&
			z+1>player.z-PLAYER_RADIUS &&
			z<player.z+PLAYER_RADIUS
		){
			return;
		}

		setBlock(
			x,y,z,
			selectedBlock
		);

		rebuildWorld();

	}
);

/* =====================================================
	Hotbar
===================================================== */

let selectedBlock=0;

const hotbar =
	document.getElementById(
		"hotbar"
	);

function makePreview(type){

	const c =
		document.createElement(
			"canvas"
		);

	c.width=16;
	c.height=16;

	const ctx =
		c.getContext("2d");

	const names=[
		"grassTop",
		"dirt",
		"stone",
		"wood",
		"leaves",
		"sand"
	];

	const tex =
		textures[names[type]];

	ctx.drawImage(
		tex.image,
		0,0
	);

	c.className="slotCanvas";

	return c;

}

function updateHotbar(){

	hotbar.innerHTML="";

	BLOCK_NAMES.forEach(
		(name,i)=>{

			const slot =
				document.createElement(
					"div"
				);

			slot.className =
				"slot"+
				(
					i===selectedBlock
					?" selected"
					:""
				);

			const number =
				document.createElement(
					"div"
				);

			number.className=
				"slotNumber";

			number.textContent=
				i+1;

			slot.appendChild(
				number
			);

			slot.appendChild(
				makePreview(i)
			);

			slot.addEventListener(
				"pointerdown",
				()=>{

					selectedBlock=i;

					updateHotbar();

				}
			);

			hotbar.appendChild(
				slot
			);

		}
	);

}

updateHotbar();

/* =====================================================
	Desktop mouse
===================================================== */

canvas.addEventListener(
	"click",
	()=>{

		if(
			window.innerWidth>700
		){

			canvas.requestPointerLock?.();

		}

	}
);

document.addEventListener(
	"mousemove",
	e=>{

		if(
			document.pointerLockElement
			!==canvas
		){
			return;
		}

		player.yaw -=
			e.movementX*.0025;

		player.pitch -=
			e.movementY*.0025;

		player.pitch =
			Math.max(
				-Math.PI/2+.05,
				Math.min(
					Math.PI/2-.05,
					player.pitch
				)
			);

	}
);

/* =====================================================
	Update
===================================================== */

let lastTime =
	performance.now();

function update(dt){

	let forward=0;
	let strafe=0;

	if(keys.KeyW)
		forward+=1;

	if(keys.KeyS)
		forward-=1;

	if(keys.KeyD)
		strafe+=1;

	if(keys.KeyA)
		strafe-=1;

	forward += -joyY;
	strafe += joyX;

	const len =
		Math.sqrt(
			forward*forward+
			strafe*strafe
		);

	if(len>1){

		forward/=len;
		strafe/=len;

	}

	const speed =
		running ||
		keys.ShiftLeft ||
		keys.ShiftRight
		?player.runSpeed
		:player.speed;

	const sin =
		Math.sin(player.yaw);

	const cos =
		Math.cos(player.yaw);

	const dx =
		(
			strafe*cos-
			forward*sin
		)*speed*dt;

	const dz =
		(
			strafe*sin+
			forward*cos
		)*speed*dt;

	moveAxis("x",dx);
	moveAxis("z",dz);

	player.onGround=false;

	player.vy -=
		18*dt;

	if(player.vy<-25)
		player.vy=-25;

	moveAxis(
		"y",
		player.vy*dt
	);

	if(player.y<-15){

		player.x=.5;
		player.z=.5;
		player.y=
			terrainHeight(0,0)+2;
		player.vy=0;

	}

	camera.position.set(
		player.x,
		player.y+1.62,
		player.z
	);

	camera.rotation.set(
		player.pitch,
		player.yaw,
		0
	);

	document.getElementById(
		"coords"
	).textContent =
		"X:"+Math.floor(player.x)+
		" Y:"+Math.floor(player.y)+
		" Z:"+Math.floor(player.z);

}

window.addEventListener(

	()=>{

		camera.aspect =
			window.innerWidth/
			window.innerHeight;

		camera.updateProjectionMatrix();

		renderer.setSize(
			window.innerWidth,
			window.innerHeight
		);

	}
);

/* =====================================================
	Start
===================================================== */

async function start(){

	const fill =
		document.getElementById(
			"loadingFill"
		);

	const text =
		document.getElementById(
			"loadingText"
		);

	fill.style.width="20%";

	text.textContent=
		"Creating terrain...";

	await new Promise(
		r=>setTimeout(r,20)
	);

	generateWorld();

	fill.style.width="65%";

	text.textContent=
		"Building chunks...";

	player.y =
		terrainHeight(0,0)+1.1;

	await new Promise(
		r=>setTimeout(r,20)
	);

	rebuildWorld();

	fill.style.width="100%";

	text.textContent=
		"Ready";

	await new Promise(
		r=>setTimeout(r,250)
	);

	document.getElementById(
		"loading"
	).style.display="none";

}

function loop(now){

	requestAnimationFrame(loop);

	const dt =
		Math.min(
			(now-lastTime)/1000,
			.05
		);

	lastTime=now;

	update(dt);

	renderer.render(
		scene,
		camera
	);

}

start();

requestAnimationFrame(loop);
